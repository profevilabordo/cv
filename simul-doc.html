document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>\n\n<!-- ═══════════════ INDEX ═══════════════ -->\n<sc-if value=\"{{ isIndex }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Índice: documentos comerciales\" style=\"min-height:100vh; background:#e7e1d4; font-family:'Hanken Grotesque',system-ui,sans-serif; color:#24201a; padding:64px 24px 80px; display:flex; justify-content:center;\">\n  <div style=\"width:100%; max-width:1000px;\">\n    <div style=\"max-width:680px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.14em; text-transform:uppercase; color:oklch(0.55 0.12 256); font-weight:600;\">EETP N° 602 · Org. y Gestión 5°A · Unidad 2<\u002Fdiv>\n      <h1 style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:54px; letter-spacing:-0.03em; line-height:1.02; margin:14px 0 0;\">Documentos<br>comerciales<\u002Fh1>\n      <p style=\"font-size:18px; color:#5d564b; line-height:1.5; margin:18px 0 0;\">Primero mirá cómo se llena cada documento, paso a paso. Después practicá el circuito completo de una operación: compra, venta, pago, cobro y notas de crédito y débito.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:44px;\">\n      <div class=\"card\" onclick=\"{{ goAnim }}\" style=\"cursor:pointer; background:#fff; border:1px solid rgba(0,0,0,0.06); border-radius:18px; padding:30px; box-shadow:0 16px 40px -22px rgba(40,32,18,0.35); height:100%; display:flex; flex-direction:column;\">\n        <div style=\"display:flex; gap:8px; margin-bottom:24px;\">\n          <div style=\"width:46px; height:58px; border-radius:6px; background:oklch(0.55 0.12 256); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px; box-shadow:0 8px 18px -8px rgba(40,32,18,0.5);\">A<\u002Fdiv>\n          <div style=\"width:46px; height:58px; border-radius:6px; background:oklch(0.56 0.11 196); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px; margin-top:8px;\">B<\u002Fdiv>\n          <div style=\"width:46px; height:58px; border-radius:6px; background:oklch(0.54 0.12 305); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:26px; margin-top:16px;\">C<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#8c8478; font-weight:600;\">Animación · ~71 s<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.015em; margin-top:8px;\">Cómo se llenan<\u002Fdiv>\n        <p style=\"font-size:15px; color:#5d564b; line-height:1.5; margin:10px 0 0;\">Factura A, B y C, remito, notas de crédito y débito y recibo. Cada campo se completa con su explicación al costado.<\u002Fp>\n        <div style=\"margin-top:auto; padding-top:22px;\">\n          <span style=\"display:inline-flex; align-items:center; gap:8px; background:oklch(0.55 0.12 256); color:#fff; padding:11px 20px; border-radius:10px; font-weight:700; font-size:15px;\">Ver la animación →<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\" onclick=\"{{ goExercise }}\" style=\"cursor:pointer; background:#fff; border:1px solid rgba(0,0,0,0.06); border-radius:18px; padding:30px; box-shadow:0 16px 40px -22px rgba(40,32,18,0.35); height:100%; display:flex; flex-direction:column;\">\n        <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:24px;\">\n          <div style=\"padding:9px 13px; border-radius:9px; background:oklch(0.55 0.12 256); color:#fff; font-weight:700; font-size:13px;\">Factura<\u002Fdiv>\n          <div style=\"color:#8c8478;\">→<\u002Fdiv>\n          <div style=\"padding:9px 13px; border-radius:9px; background:oklch(0.55 0.11 150); color:#fff; font-weight:700; font-size:13px;\">NC<\u002Fdiv>\n          <div style=\"color:#8c8478;\">→<\u002Fdiv>\n          <div style=\"padding:9px 13px; border-radius:9px; background:oklch(0.60 0.11 72); color:#fff; font-weight:700; font-size:13px;\">Recibo<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#8c8478; font-weight:600;\">Ejercitación · 9 pasos<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.015em; margin-top:8px;\">Practicá el circuito<\u002Fdiv>\n        <p style=\"font-size:15px; color:#5d564b; line-height:1.5; margin:10px 0 0;\">Un caso nuevo de punta a punta: elegí la letra, calculá el IVA, identificá cada nota y ordená la secuencia. Corrige y explica el porqué.<\u002Fp>\n        <div style=\"margin-top:auto; padding-top:22px;\">\n          <span style=\"display:inline-flex; align-items:center; gap:8px; background:oklch(0.55 0.11 150); color:#fff; padding:11px 20px; border-radius:10px; font-weight:700; font-size:15px;\">Empezar a practicar →<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ═══════════════ ANIMACIÓN ═══════════════ -->\n<sc-if value=\"{{ isAnim }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Animación: llenado de documentos\" style=\"position:fixed; inset:0; background:#0a0a0a;\">\n  <x-import component-from-global-scope=\"DocAnimation\" from=\"225b5b36-f4e0-4734-a09a-3b8bf349f5da#/animations.jsx\" hint-size=\"100%,100%\"><\u002Fx-import>\n  <button onclick=\"{{ goIndex }}\" style=\"position:fixed; top:20px; left:20px; z-index:50; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.92); border:none; border-radius:10px; padding:10px 16px; font-family:'Hanken Grotesque',sans-serif; font-weight:700; font-size:14px; color:#24201a; cursor:pointer; box-shadow:0 6px 18px -6px rgba(0,0,0,0.5);\">← Volver al índice<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ═══════════════ EJERCICIO ═══════════════ -->\n<sc-if value=\"{{ isExercise }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Ejercitación: circuito comercial\" style=\"min-height:100vh; background:#e7e1d4; font-family:'Hanken Grotesque',system-ui,sans-serif; color:#24201a; padding:34px 24px 80px; display:flex; justify-content:center;\">\n  <div style=\"width:100%; max-width:940px;\">\n    <button onclick=\"{{ goIndex }}\" style=\"display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:10px; padding:9px 15px; font-family:inherit; font-weight:700; font-size:13.5px; color:#24201a; cursor:pointer; margin-bottom:20px; box-shadow:0 2px 8px rgba(40,32,18,0.06);\">← Índice<\u002Fbutton>\n\n    <div style=\"display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:18px;\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; color:oklch(0.55 0.12 256); font-weight:600;\">Org. y Gestión · Unidad 2<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:34px; letter-spacing:-0.02em; line-height:1.05; margin-top:6px;\">Circuito comercial completo<\u002Fdiv>\n        <div style=\"font-size:15px; color:#5d564b; margin-top:6px;\">Compra · venta · pago/cobro · notas de crédito y débito<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:10px; align-items:center;\">\n        <div style=\"background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:999px; padding:8px 15px; font-size:13px; font-weight:700; box-shadow:0 2px 8px rgba(40,32,18,0.06); white-space:nowrap;\">Paso {{ stepNum }} / {{ stepTotal }}<\u002Fdiv>\n        <div style=\"background:oklch(0.55 0.11 150); color:#fff; border-radius:999px; padding:8px 15px; font-size:13px; font-weight:700;\">{{ scoreText }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"height:6px; background:rgba(0,0,0,0.08); border-radius:999px; overflow:hidden; margin-bottom:20px;\">\n      <div style=\"height:100%; background:oklch(0.55 0.12 256); border-radius:999px; transition:width 350ms ease; width:{{ progressPct }};\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fbf9f4; border:1px solid rgba(0,0,0,0.06); border-radius:12px; padding:16px 20px; margin-bottom:18px; box-shadow:0 2px 10px rgba(40,32,18,0.05);\">\n      <div style=\"font-size:10.5px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:#8c8478; margin-bottom:9px;\">El caso<\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:16px; flex-wrap:wrap;\">\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <div style=\"width:38px; height:38px; border-radius:9px; background:oklch(0.55 0.12 256); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:16px;\">V<\u002Fdiv>\n          <div><div style=\"font-weight:700; font-size:14.5px;\">VenadoTec Insumos SRL<\u002Fdiv><div style=\"font-size:12px; color:#8c8478;\">Vendedor · Responsable Inscripto<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:20px; color:#8c8478;\">→<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <div style=\"width:38px; height:38px; border-radius:9px; background:oklch(0.54 0.12 305); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:16px;\">D<\u002Fdiv>\n          <div><div style=\"font-weight:700; font-size:14.5px;\">Estudio Delta SA<\u002Fdiv><div style=\"font-size:12px; color:#8c8478;\">Cliente · Responsable Inscripto<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px; color:#5d564b; margin-left:auto; max-width:300px;\">Venta de notebooks y SSD el 10/05/2026, con devolución, mora y cobro posterior.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:16px; padding:30px 32px; box-shadow:0 16px 40px -20px rgba(40,32,18,0.35);\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; color:oklch(0.55 0.12 256);\">Antes de empezar<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:23px; letter-spacing:-0.01em; margin:10px 0 4px;\">Elegí tu nombre y escribí tu clave<\u002Fh2>\n        <div style=\"font-size:14px; color:#5d564b; line-height:1.5; margin-bottom:20px;\">Al terminar los 9 pasos, tu resultado se le envía automáticamente a la profe.<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:9px; margin-bottom:20px;\">\n          <sc-for list=\"{{ alumnoViews }}\" as=\"al\" hint-placeholder-count=\"20\">\n            <button onclick=\"{{ al.onClick }}\" style=\"{{ al.style }}\">{{ al.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:12px; align-items:center; flex-wrap:wrap;\">\n          <div style=\"display:flex; align-items:center; background:#f4f1ea; border-radius:9px; padding:0 12px;\">\n            <input type=\"text\" placeholder=\"tu clave\" value=\"{{ claveVal }}\" onchange=\"{{ onClave }}\" style=\"border:none; background:transparent; padding:12px 6px; font-size:15px; font-weight:600; width:180px; color:#24201a;\">\n          <\u002Fdiv>\n          <button onclick=\"{{ onEntrar }}\" style=\"{{ entrarStyle }}\">Entrar →<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"{{ loginErrStyle }}\">La clave no coincide con el nombre elegido. Revisala e intentá de nuevo.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showQuestion }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:16px; padding:30px 32px; box-shadow:0 16px 40px -20px rgba(40,32,18,0.35);\">\n        <div style=\"{{ kindLabelStyle }}\">{{ kindLabel }}<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:23px; letter-spacing:-0.01em; line-height:1.25; margin:10px 0 4px;\">{{ prompt }}<\u002Fh2>\n        <div style=\"font-size:14px; color:#5d564b; line-height:1.5; margin-bottom:22px;\">{{ subprompt }}<\u002Fdiv>\n\n        <sc-if value=\"{{ isMC }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; flex-direction:column; gap:11px;\">\n            <sc-for list=\"{{ optionViews }}\" as=\"opt\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">\n                <span style=\"{{ opt.badgeStyle }}\">{{ opt.badge }}<\u002Fspan>\n                <span style=\"flex:1; min-width:0; white-space:nowrap; font-size:15.5px; font-weight:600; color:#24201a;\">{{ opt.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isNum }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; flex-direction:column; gap:13px;\">\n            <sc-for list=\"{{ fieldViews }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:14px; flex-wrap:wrap;\">\n                <div style=\"flex:1; min-width:200px; font-size:15px; font-weight:600;\">{{ f.label }}<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:10px;\">\n                  <div style=\"{{ f.boxStyle }}\">\n                    <span style=\"font-family:'IBM Plex Mono',monospace; color:#8c8478; font-size:15px;\">$<\u002Fspan>\n                    <input type=\"text\" inputmode=\"numeric\" placeholder=\"0\" value=\"{{ f.value }}\" onchange=\"{{ f.onChange }}\" disabled=\"{{ f.disabled }}\" style=\"border:none; background:transparent; padding:11px 6px; font-size:15px; font-weight:600; width:150px; text-align:right; color:#24201a;\">\n                  <\u002Fdiv>\n                  <span style=\"{{ f.markStyle }}\">{{ f.markText }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isOrder }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"font-size:12.5px; color:#8c8478; margin-bottom:10px; font-weight:600;\">Hacé clic en los documentos en el orden correcto:<\u002Fdiv>\n            <div style=\"display:flex; gap:10px; flex-wrap:wrap; min-height:54px; padding:14px; background:#faf8f2; border:1.5px dashed rgba(0,0,0,0.12); border-radius:12px; margin-bottom:14px; align-items:center;\">\n              <sc-for list=\"{{ seqViews }}\" as=\"s\" hint-placeholder-count=\"0\">\n                <button onclick=\"{{ s.onClick }}\" style=\"{{ s.style }}\">\n                  <span style=\"font-family:'IBM Plex Mono',monospace; opacity:0.8;\">{{ s.pos }}<\u002Fspan> {{ s.label }} <span style=\"opacity:0.75;\">{{ s.mark }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <span style=\"{{ seqEmptyStyle }}\">El circuito aparece acá…<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n              <sc-for list=\"{{ poolViews }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <button onclick=\"{{ p.onClick }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ checked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"{{ fbBoxStyle }}\">\n            <div style=\"{{ fbIconStyle }}\">{{ fbIcon }}<\u002Fdiv>\n            <div>\n              <div style=\"{{ fbTitleStyle }}\">{{ fbTitle }}<\u002Fdiv>\n              <div style=\"font-size:14px; color:#3f3a32; line-height:1.5; margin-top:4px;\">{{ fbBody }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; justify-content:flex-end; gap:12px; margin-top:18px;\">\n        <sc-if value=\"{{ showCheck }}\" hint-placeholder-val=\"{{ true }}\">\n          <button onclick=\"{{ onCheck }}\" disabled=\"{{ checkDisabled }}\" style=\"{{ checkBtnStyle }}\">Comprobar<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ checked }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ onNext }}\" style=\"padding:13px 28px; border-radius:11px; border:none; background:#24201a; color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;\">{{ nextLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ done }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff; border:1px solid rgba(0,0,0,0.07); border-radius:16px; padding:44px 40px; text-align:center; box-shadow:0 16px 40px -20px rgba(40,32,18,0.35);\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:oklch(0.55 0.12 256); font-weight:600;\">Resultado<\u002Fdiv>\n        <div style=\"{{ scoreBigStyle }}\">{{ scoreBig }}<\u002Fdiv>\n        <div style=\"font-size:17px; font-weight:600; color:#24201a;\">{{ summaryTitle }}<\u002Fdiv>\n        <div style=\"font-size:15px; color:#5d564b; line-height:1.5; max-width:460px; margin:10px auto 0;\">{{ summaryBody }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:oklch(0.50 0.13 150); margin-top:16px;\">📧 Tu resultado se envió a la profe<\u002Fdiv>\n        <div style=\"display:flex; gap:12px; justify-content:center; margin-top:28px;\">\n          <button onclick=\"{{ onRestart }}\" style=\"padding:13px 30px; border-radius:11px; border:none; background:#24201a; color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;\">Volver a empezar<\u002Fbutton>\n          <button onclick=\"{{ goIndex }}\" style=\"padding:13px 30px; border-radius:11px; border:1px solid rgba(0,0,0,0.15); background:#fff; color:#24201a; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;\">Ir al índice<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { view: 'index', i: 0, picked: null, fieldVals: {}, seq: [], checked: false, results: [], done: false, alumnoSel: null, clave: '', loginError: false, logueado: false, enviado: false };\n  }\n\n  get questions() {\n    return [\n      { id: 'letra', kind: 'mc',\n        prompt: '¿Qué letra de factura debe emitir VenadoTec?',\n        subprompt: 'VenadoTec (Responsable Inscripto) le vende a Estudio Delta SA, que también es Responsable Inscripto.',\n        options: ['Factura A', 'Factura B', 'Factura C', 'Factura E'], correct: 0,\n        explain: 'Entre dos Responsables Inscriptos siempre corresponde Factura A: discrimina el IVA y le permite al comprador tomarlo como crédito fiscal. (B es para consumidor final, C la emite un monotributista y E es para exportación.)' },\n\n      { id: 'totalesA', kind: 'num',\n        prompt: 'Completá los totales de la Factura A.',\n        subprompt: 'Renglones: 2 notebooks a $620.000 y 4 SSD a $95.000. Alícuota de IVA: 21%.',\n        fields: [\n          { id: 'neto', label: 'Subtotal Neto Gravado al 21%', answer: 1620000 },\n          { id: 'iva', label: 'IVA 21%', answer: 340200 },\n          { id: 'total', label: 'TOTAL', answer: 1960200 },\n        ],\n        explain: 'Neto = 2×620.000 + 4×95.000 = 1.240.000 + 380.000 = 1.620.000. IVA = 1.620.000 × 0,21 = 340.200. Total = 1.620.000 + 340.200 = 1.960.200.' },\n\n      { id: 'devDoc', kind: 'mc',\n        prompt: 'Delta devuelve 1 SSD que vino fallado.',\n        subprompt: '¿Qué documento emite VenadoTec y qué efecto tiene sobre la deuda?',\n        options: ['Nota de crédito — disminuye la deuda', 'Nota de débito — aumenta la deuda', 'Recibo — cancela la deuda', 'Remito — registra la devolución'], correct: 0,\n        explain: 'La nota de crédito DISMINUYE la deuda del cliente. Se emite por devoluciones, descuentos posteriores o errores de facturación, y siempre referencia la factura original.' },\n\n      { id: 'totalNC', kind: 'num',\n        prompt: 'Calculá el total de la Nota de Crédito A.',\n        subprompt: 'Se devuelve 1 SSD de $95.000, con IVA 21% (igual que la factura original).',\n        fields: [\n          { id: 'netonc', label: 'Neto', answer: 95000 },\n          { id: 'ivanc', label: 'IVA 21%', answer: 19950 },\n          { id: 'totalnc', label: 'TOTAL Nota de Crédito', answer: 114950 },\n        ],\n        explain: 'Neto 95.000 · IVA 95.000×0,21 = 19.950 · Total 114.950. La deuda baja de 1.960.200 a 1.845.250.' },\n\n      { id: 'moraDoc', kind: 'mc',\n        prompt: 'Delta se atrasa 20 días en pagar.',\n        subprompt: 'VenadoTec le cobra intereses por mora. ¿Qué documento emite?',\n        options: ['Nota de débito — aumenta la deuda', 'Nota de crédito — disminuye la deuda', 'Otra factura A', 'Un nuevo remito'], correct: 0,\n        explain: 'La nota de débito AUMENTA la deuda. Se emite por intereses por mora, gastos no incluidos en la factura original o ajustes a favor del vendedor.' },\n\n      { id: 'totalND', kind: 'num',\n        prompt: 'Calculá el total de la Nota de Débito A.',\n        subprompt: 'Los intereses por mora son $50.000. Como es ND \"A\", también lleva IVA 21%.',\n        fields: [\n          { id: 'netond', label: 'Neto (intereses)', answer: 50000 },\n          { id: 'ivand', label: 'IVA 21%', answer: 10500 },\n          { id: 'totalnd', label: 'TOTAL Nota de Débito', answer: 60500 },\n        ],\n        explain: 'Neto 50.000 · IVA 10.500 · Total 60.500. La deuda sube de 1.845.250 a 1.905.750.' },\n\n      { id: 'reciboQuien', kind: 'mc',\n        prompt: 'Finalmente Delta paga todo y se emite un recibo.',\n        subprompt: '¿Quién emite el recibo?',\n        options: ['VenadoTec — es quien recibe el dinero', 'Estudio Delta — es quien paga', 'El banco interviniente', 'Lo firman los dos a la vez'], correct: 0,\n        explain: 'El recibo lo emite quien RECIBE el dinero (el vendedor/acreedor) y se lo entrega a quien paga. Respalda el cobro e indica la forma de pago.' },\n\n      { id: 'montoFinal', kind: 'num',\n        prompt: '¿Por qué importe total se emite el recibo?',\n        subprompt: 'Factura 1.960.200 − Nota de Crédito 114.950 + Nota de Débito 60.500.',\n        fields: [\n          { id: 'final', label: 'Importe del recibo', answer: 1905750 },\n        ],\n        explain: '1.960.200 − 114.950 + 60.500 = 1.905.750. El recibo cancela ese saldo final, que va en números y en letras.' },\n\n      { id: 'orden', kind: 'order',\n        prompt: 'Ordená el circuito completo.',\n        subprompt: 'Desde la venta inicial hasta el cobro final.',\n        items: [\n          { id: 'fac', label: 'Factura A', tone: 'oklch(0.55 0.12 256)' },\n          { id: 'rem', label: 'Remito', tone: 'oklch(0.50 0.03 265)' },\n          { id: 'nc', label: 'Nota de Crédito', tone: 'oklch(0.55 0.11 150)' },\n          { id: 'nd', label: 'Nota de Débito', tone: 'oklch(0.57 0.14 33)' },\n          { id: 'rec', label: 'Recibo', tone: 'oklch(0.60 0.11 72)' },\n        ],\n        correctOrder: ['fac', 'rem', 'nc', 'nd', 'rec'],\n        explain: 'Primero la venta (Factura A) y la entrega (Remito). Después los ajustes: la devolución (Nota de Crédito) y los intereses (Nota de Débito). Por último, el cobro (Recibo).' },\n    ];\n  }\n\n  fmt(n) { return n.toLocaleString('es-AR'); }\n  parseNum(v) {\n    const s = String(v == null ? '' : v).replace(/[^\\d]/g, '');\n    return s === '' ? null : parseInt(s, 10);\n  }\n\n  go(view) { this.setState({ view }); }\n  pick(idx) { if (!this.state.checked) this.setState({ picked: idx }); }\n  setField(id, v) {\n    if (this.state.checked) return;\n    this.setState(s => ({ fieldVals: { ...s.fieldVals, [id]: v } }));\n  }\n  toggleSeq(id) {\n    if (this.state.checked) return;\n    this.setState(s => s.seq.includes(id)\n      ? { seq: s.seq.filter(x => x !== id) }\n      : { seq: [...s.seq, id] });\n  }\n\n  isCorrect() {\n    const q = this.questions[this.state.i];\n    if (q.kind === 'mc') return this.state.picked === q.correct;\n    if (q.kind === 'num') return q.fields.every(f => this.parseNum(this.state.fieldVals[f.id]) === f.answer);\n    if (q.kind === 'order') return q.correctOrder.length === this.state.seq.length && q.correctOrder.every((id, k) => this.state.seq[k] === id);\n    return false;\n  }\n\n  check() {\n    if (this.state.checked) return;\n    const ok = this.isCorrect();\n    this.setState(s => { const r = s.results.slice(); r[s.i] = ok; return { checked: true, results: r }; });\n  }\n\n  next() {\n    const last = this.state.i >= this.questions.length - 1;\n    if (last) { this.setState({ done: true }); this.enviarResultado(); return; }\n    this.setState(s => ({ i: s.i + 1, picked: null, fieldVals: {}, seq: [], checked: false }));\n  }\n\n  restart() { this.setState({ i: 0, picked: null, fieldVals: {}, seq: [], checked: false, results: [], done: false, enviado: false }); }\n\n  get alumnos() {\n    return [{n:'ALBORNOZ, ROMÁN JAVIER',k:'a3Jha293'}, {n:'ALBORUA, JOCABED NAHIR',k:'c2FsdmFkb3I='}, {n:'ALI, SAÍD BAUTISTA',k:'cmVjaWZl'}, {n:'BANEGAS, BRIAN AQUILES',k:'Z3VhZGFsYWphcmE='}, {n:'BONFIGLIO, ZAIRA ARACELI',k:'bW9udGVycmV5'}, {n:'BUSTOS, IGNACIO',k:'dG9yb250bw=='}, {n:'CASTILLO, LUDMILA SOLEDAD',k:'bW9udHJlYWw='}, {n:'CEJAS, MELANI TATIANA',k:'dmFuY291dmVy'}, {n:'CLERICO, MÁXIMO EMANUEL',k:'Y2FzYWJsYW5jYQ=='}, {n:'CORONEL, UZIEL EXEQUIEL',k:'Y2FwZXRvd24='}, {n:'DELLOSA, VALENTÍN SEBASTIÁN',k:'bGFnb3M='}, {n:'FERREYRA, JORGE AGUSTÍN',k:'YW1hem9uYXM='}, {n:'GRAGLIA, VALENTINA ANAHÍ',k:'bmlsbw=='}, {n:'LEALI, ISABEL',k:'Z2FuZ2Vz'}, {n:'MONTIVERO, ROMÁN MARTÍN',k:'ZGFudWJpbw=='}, {n:'MORENO, THIAGO NICOLÁS',k:'dm9sZ2E='}, {n:'MOYA GUZMAN, MIQUEAS',k:'bWlzaXNpcGk='}, {n:'RODRIGUEZ, JOSEFINA ABRIL',k:'eWFuZ3Rz6Q=='}, {n:'TORRILLA, LOURDES AIMÉ',k:'b3Jpbm9jbw=='}, {n:'ZUVIRIA, AGUSTINA',k:'cGFyYW5h'}];\n  }\n  sinAcentos(t) { return String(t || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').trim().toLowerCase(); }\n  pickAlumno(n) { this.setState({ alumnoSel: n, loginError: false }); }\n  setClave(e) { this.setState({ clave: e.target.value, loginError: false }); }\n  tryLogin() {\n    const a = this.alumnos.find(x => x.n === this.state.alumnoSel);\n    if (!a) { this.setState({ loginError: true }); return; }\n    const ok = this.sinAcentos(atob(a.k)) === this.sinAcentos(this.state.clave);\n    this.setState(ok ? { logueado: true, loginError: false } : { loginError: true });\n  }\n  enviarResultado() {\n    if (this.state.enviado || !this.state.alumnoSel) return;\n    const score = this.state.results.filter(Boolean).length;\n    const nota = Math.round(score / this.questions.length * 100);\n    fetch('https://formsubmit.co/ajax/profevilabordo@gmail.com', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },\n      body: JSON.stringify({\n        'Evaluación': 'Simulación Circuito Comercial (Documentos)',\n        'Asignatura': 'Organización y Gestión',\n        'Curso': '5A - EETP 602',\n        'Estudiante': this.state.alumnoSel,\n        'Nota': nota + '/100',\n        'Respuestas Correctas': score + '/' + this.questions.length,\n        '_subject': '✅ [5A-OyG] Simulación Circuito: ' + this.state.alumnoSel,\n        '_captcha': 'false'\n      })\n    }).catch(function(e) { console.error('Error al enviar:', e); });\n    this.setState({ enviado: true });\n  }\n\n  renderVals() {\n    const C = { blue: 'oklch(0.55 0.12 256)', green: 'oklch(0.50 0.13 150)', red: 'oklch(0.55 0.17 28)', ink: '#24201a', mut: '#8c8478' };\n    const MONO = \"'IBM Plex Mono', monospace\";\n    const Qs = this.questions;\n    const i = this.state.i;\n    const q = Qs[i] || Qs[0];\n    const checked = this.state.checked;\n    const score = this.state.results.filter(Boolean).length;\n\n    const kindLabel = { mc: 'Elegí la opción correcta', num: 'Completá los importes', order: 'Ordená la secuencia' }[q.kind];\n    const kindColor = q.kind === 'num' ? C.green : (q.kind === 'order' ? 'oklch(0.57 0.13 33)' : C.blue);\n\n    const base = {\n      view: this.state.view,\n      isIndex: this.state.view === 'index',\n      isAnim: this.state.view === 'anim',\n      isExercise: this.state.view === 'exercise',\n      goIndex: () => this.go('index'),\n      goAnim: () => this.go('anim'),\n      goExercise: () => this.go('exercise'),\n\n      stepNum: i + 1, stepTotal: Qs.length,\n      scoreText: 'Aciertos ' + score + '/' + Qs.length,\n      progressPct: Math.round((this.state.done ? Qs.length : i) / Qs.length * 100) + '%',\n      showQuestion: !this.state.done && this.state.logueado, done: this.state.done,\n      showLogin: !this.state.logueado,\n      claveVal: this.state.clave,\n      onClave: (e) => this.setClave(e),\n      onEntrar: () => this.tryLogin(),\n      alumnoViews: this.alumnos.map(a => ({ label: a.n, onClick: () => this.pickAlumno(a.n), style: { cursor: 'pointer', padding: '10px 14px', borderRadius: 10, fontFamily: 'inherit', fontSize: 13.5, fontWeight: 700, textAlign: 'left', background: this.state.alumnoSel === a.n ? 'oklch(0.55 0.12 256)' : '#fff', color: this.state.alumnoSel === a.n ? '#fff' : '#24201a', border: '2px solid ' + (this.state.alumnoSel === a.n ? 'oklch(0.55 0.12 256)' : 'rgba(0,0,0,0.12)') } })),\n      loginErrStyle: { display: this.state.loginError ? 'block' : 'none', color: 'oklch(0.55 0.17 28)', fontWeight: 700, fontSize: 13.5, marginTop: 10 },\n      entrarStyle: { padding: '12px 26px', borderRadius: 10, border: 'none', background: (this.state.alumnoSel && this.state.clave) ? 'oklch(0.55 0.12 256)' : '#cfc8bb', color: '#fff', fontFamily: 'inherit', fontSize: 15, fontWeight: 700, cursor: (this.state.alumnoSel && this.state.clave) ? 'pointer' : 'not-allowed' },\n      kindLabel, prompt: q.prompt, subprompt: q.subprompt || '',\n      kindLabelStyle: { fontFamily: MONO, fontSize: 12, letterSpacing: '0.1em', textTransform: 'uppercase', fontWeight: 600, color: kindColor },\n      isMC: q.kind === 'mc', isNum: q.kind === 'num', isOrder: q.kind === 'order',\n      checked,\n      showCheck: !checked,\n      onCheck: () => this.check(), onNext: () => this.next(), onRestart: () => this.restart(),\n      nextLabel: i >= Qs.length - 1 ? 'Ver resultados' : 'Siguiente →',\n    };\n\n    let canCheck = false;\n    if (q.kind === 'mc') canCheck = this.state.picked != null;\n    else if (q.kind === 'num') canCheck = q.fields.every(f => this.parseNum(this.state.fieldVals[f.id]) != null);\n    else if (q.kind === 'order') canCheck = this.state.seq.length === q.items.length;\n    base.checkDisabled = !canCheck;\n    base.checkBtnStyle = { padding: '13px 28px', borderRadius: 11, border: 'none', fontFamily: 'inherit', fontSize: 15, fontWeight: 700, color: '#fff', background: canCheck ? C.blue : '#cfc8bb', cursor: canCheck ? 'pointer' : 'not-allowed' };\n\n    if (q.kind === 'mc') {\n      const letters = ['A', 'B', 'C', 'D'];\n      const btnBase = { display: 'flex', alignItems: 'center', gap: 14, textAlign: 'left', cursor: checked ? 'default' : 'pointer', padding: '15px 17px', borderRadius: 11, fontFamily: 'inherit', width: '100%' };\n      const badgeBase = { flexShrink: 0, width: 28, height: 28, borderRadius: 999, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: MONO, fontWeight: 700, fontSize: 14 };\n      base.optionViews = q.options.map((label, idx) => {\n        const picked = this.state.picked === idx;\n        const isAns = q.correct === idx;\n        let style = { ...btnBase, background: '#fff', border: '2px solid rgba(0,0,0,0.1)' };\n        let badgeStyle = { ...badgeBase, background: '#f0ece3', color: C.mut };\n        let badge = letters[idx];\n        if (!checked && picked) { style = { ...btnBase, background: 'oklch(0.97 0.02 256)', border: '2px solid ' + C.blue }; badgeStyle = { ...badgeBase, background: C.blue, color: '#fff' }; }\n        if (checked && isAns) { style = { ...btnBase, background: 'oklch(0.96 0.04 150)', border: '2px solid ' + C.green }; badgeStyle = { ...badgeBase, background: C.green, color: '#fff' }; badge = '✓'; }\n        if (checked && picked && !isAns) { style = { ...btnBase, background: 'oklch(0.96 0.04 28)', border: '2px solid ' + C.red }; badgeStyle = { ...badgeBase, background: C.red, color: '#fff' }; badge = '✕'; }\n        if (checked && !isAns && !picked) { style = { ...btnBase, background: '#fff', border: '2px solid rgba(0,0,0,0.07)', opacity: 0.55 }; }\n        return { label, badge, style, badgeStyle, onClick: () => this.pick(idx) };\n      });\n    }\n\n    if (q.kind === 'num') {\n      const boxBase = { display: 'flex', alignItems: 'center', borderRadius: 9, padding: '0 12px' };\n      base.fieldViews = q.fields.map(f => {\n        const raw = this.state.fieldVals[f.id] || '';\n        const val = this.parseNum(raw);\n        let boxStyle = { ...boxBase, background: '#f4f1ea', border: '2px solid transparent' };\n        let markStyle = { fontSize: 13, fontWeight: 600, minWidth: 100, color: 'transparent' };\n        let markText = '·';\n        if (checked) {\n          const ok = val === f.answer;\n          boxStyle = { ...boxBase, border: '2px solid ' + (ok ? C.green : C.red), background: ok ? 'oklch(0.97 0.03 150)' : 'oklch(0.97 0.03 28)' };\n          markStyle = { fontSize: 13, fontWeight: 700, minWidth: 100, color: ok ? C.green : C.red };\n          markText = ok ? '✓ Correcto' : '✕ $' + this.fmt(f.answer);\n        }\n        return { label: f.label, value: raw, disabled: checked, boxStyle, markStyle, markText,\n          onChange: (e) => this.setField(f.id, e.target.value) };\n      });\n    }\n\n    if (q.kind === 'order') {\n      const byId = Object.fromEntries(q.items.map(it => [it.id, it]));\n      const seqBase = { display: 'flex', alignItems: 'center', gap: 7, cursor: checked ? 'default' : 'pointer', padding: '10px 15px', borderRadius: 10, fontFamily: 'inherit', fontSize: 14.5, fontWeight: 700, color: '#fff', border: 'none' };\n      base.seqViews = this.state.seq.map((id, pos) => {\n        const it = byId[id];\n        let style = { ...seqBase, background: it.tone };\n        let mark = '';\n        if (checked) {\n          const ok = q.correctOrder[pos] === id;\n          style = { ...seqBase, background: ok ? C.green : C.red };\n          mark = ok ? '✓' : '✕';\n        }\n        return { label: it.label, pos: pos + 1, mark, style, onClick: () => this.toggleSeq(id) };\n      });\n      base.seqEmptyStyle = { fontSize: 13, color: '#b0a99b', display: this.state.seq.length ? 'none' : 'inline' };\n      base.poolViews = q.items.filter(it => !this.state.seq.includes(it.id)).map(it => ({\n        label: it.label, onClick: () => this.toggleSeq(it.id),\n        style: { cursor: 'pointer', padding: '10px 15px', borderRadius: 10, fontFamily: 'inherit', fontSize: 14.5, fontWeight: 700, background: '#fff', border: '2px solid ' + it.tone, color: it.tone },\n      }));\n    }\n\n    if (checked) {\n      const ok = this.isCorrect();\n      base.fbIcon = ok ? '✓' : '✕';\n      base.fbTitle = ok ? '¡Correcto!' : 'Revisá esto';\n      base.fbBody = q.explain;\n      base.fbBoxStyle = { marginTop: 22, borderRadius: 12, padding: '16px 18px', display: 'flex', gap: 13, background: ok ? 'oklch(0.97 0.03 150)' : 'oklch(0.97 0.03 50)', border: '1px solid ' + (ok ? 'oklch(0.85 0.06 150)' : 'oklch(0.85 0.08 50)') };\n      base.fbIconStyle = { flexShrink: 0, width: 26, height: 26, borderRadius: 999, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 15, color: '#fff', background: ok ? C.green : C.red };\n      base.fbTitleStyle = { fontWeight: 800, fontSize: 15.5, color: ok ? C.green : C.red };\n    }\n\n    if (this.state.done) {\n      const pct = score / Qs.length;\n      const col = pct >= 0.8 ? C.green : (pct >= 0.5 ? 'oklch(0.6 0.11 72)' : C.red);\n      base.scoreBig = score + '/' + Qs.length;\n      base.scoreBigStyle = { fontFamily: \"'Bricolage Grotesque', sans-serif\", fontWeight: 800, fontSize: 64, letterSpacing: '-0.02em', lineHeight: 1, margin: '14px 0 6px', color: col };\n      if (pct >= 0.8) { base.summaryTitle = '¡Dominás el circuito!'; base.summaryBody = 'Entendés cómo se encadenan factura, remito, notas y recibo. Repasá los pasos que falten para llegar al pleno.'; }\n      else if (pct >= 0.5) { base.summaryTitle = 'Vas bien encaminado'; base.summaryBody = 'Tenés la idea general del circuito. Volvé a la animación para afianzar el llenado y los cálculos de IVA.'; }\n      else { base.summaryTitle = 'A repasar el circuito'; base.summaryBody = 'Mirá de nuevo la animación del llenado de documentos y volvé a intentar: prestá atención a qué letra de factura y al efecto de cada nota.'; }\n    }\n\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
