<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Cuaderno Vivo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'DM Sans',sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#F8FAFC 0%,#EEF2FF 50%,#FFF7ED 100%);padding:20px 16px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes confetti{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(-120px) translateX(30px) rotate(360deg)}}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
.hdr{text-align:center;margin-bottom:28px}
.hdr h1{font-size:26px;font-weight:800;letter-spacing:-1px;color:#4F46E5;background:linear-gradient(135deg,var(--c1,#6366F1),var(--c2,#8B5CF6));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline}
.tabs{display:flex;gap:4px;margin-bottom:24px;justify-content:center;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:12px;border:none;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .3s}
.tab.on{color:#fff;transform:scale(1.05)}.tab:not(.on){background:#fff;color:#6B7280;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cnt{max-width:600px;margin:0 auto}
.sh{padding:28px 32px;border-radius:20px 20px 0 0;position:relative;overflow:hidden;color:#fff}
.sh .big{position:absolute;top:-30px;right:-20px;font-size:100px;opacity:.1;transform:rotate(12deg)}
.sh h2{font-size:28px;font-weight:800;letter-spacing:-.5px}
.sh p{font-size:14px;opacity:.8;margin-top:6px}
.sb{padding:20px;background:#fff;border-radius:0 0 20px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
.card{background:#fff;border-radius:16px;border:1px solid #E5E7EB;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cardh{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.cardh h4{font-size:16px;font-weight:700;color:#1F2937;margin:0}
.cardh small{font-size:13px;color:#6B7280}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.arrow{transition:transform .3s;font-size:18px;color:#9CA3AF}.arrow.open{transform:rotate(180deg)}
.body{padding:20px;border-top:1px solid #F3F4F6;animation:fadeIn .3s}
.btn{display:block;margin:14px auto 0;padding:10px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn:disabled{background:#D1D5DB;cursor:not-allowed;box-shadow:none}
.btn2{padding:6px 16px;border-radius:8px;border:none;background:#6366F1;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
textarea{width:100%;padding:12px;border-radius:10px;border:2px solid #E5E7EB;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;min-height:65px;box-sizing:border-box}
textarea:focus{border-color:#C7D2FE}
input[type=text]{width:100%;padding:10px 14px;border-radius:10px;border:2px solid #E5E7EB;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box}
.bar{height:6px;border-radius:6px;background:#E5E7EB;overflow:hidden}.barfill{height:100%;border-radius:6px;transition:width .5s}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;animation:fadeIn .3s}
.foot{margin-top:28px;padding:20px;border-radius:16px;background:#F9FAFB;border:1px dashed #D1D5DB;text-align:center;font-size:13px;color:#6B7280}

/* BARRA DE PROGRESO FIJA */
#progressBar{position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff;border-bottom:1px solid #E5E7EB;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
#progressBar .pb-label{font-size:11px;font-weight:700;color:#6B7280;white-space:nowrap}
#progressBar .pb-track{flex:1;height:8px;background:#F3F4F6;border-radius:8px;overflow:hidden}
#progressBar .pb-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#6366F1,#10B981);transition:width .4s ease}
#progressBar .pb-count{font-size:13px;font-weight:800;color:#6366F1;white-space:nowrap;min-width:36px;text-align:right}
#progressBar .pb-dots{display:flex;gap:3px;align-items:center}
#progressBar .pb-dot{width:16px;height:16px;border-radius:50%;border:2px solid #E5E7EB;background:#fff;font-size:8px;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0;cursor:default}
#progressBar .pb-dot.done{background:#10B981;border-color:#10B981;color:#fff}
#progressBar .pb-dot.active{border-color:#6366F1;background:#EEF2FF}
body{padding-top:52px}
.check-section-btn{display:flex;align-items:center;justify-content:center;gap:10px;margin:24px auto 0;padding:14px 28px;border-radius:14px;border:2px solid #10B981;background:#ECFDF5;color:#065F46;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .3s;width:100%;max-width:400px;box-sizing:border-box}
.check-section-btn:hover{background:#D1FAE5;transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.2)}
.check-section-done{display:flex;align-items:center;justify-content:center;gap:8px;margin:24px auto 0;padding:12px 28px;border-radius:14px;background:#065F4610;color:#065F46;font-size:14px;font-weight:700;width:100%;max-width:400px;border:2px solid #10B98140;box-sizing:border-box}

/* FEEDBACK & LOGROS */
.docente-feedback{background:#F0F9FF;border:2px solid #3B82F6;border-radius:18px;padding:18px;margin-bottom:24px;position:relative;animation:fadeIn .5s ease;box-shadow:0 4px 15px rgba(59,130,246,0.1)}
.docente-feedback::before{content:'👨‍🏫 Comentario de la Profe:';display:block;font-size:11px;font-weight:800;color:#2563EB;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.docente-feedback p{font-size:15px;color:#1E40AF;line-height:1.5;margin:0;font-style:italic}

.achievements-section{margin-top:20px;animation:fadeIn 0.8s ease both}
.achievements-grid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:800px;margin:0 auto}
.achievement-card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;transition:all 0.4s;opacity:0.15;filter:grayscale(1);transform:scale(0.95);flex: 0 1 calc(25% - 8px);min-width:130px}
.achievement-card.unlocked{opacity:1;filter:grayscale(0);border-color:#F59E0B;background:#FFFBEB;box-shadow:0 2px 8px rgba(245,158,11,0.15);transform:scale(1)}
.achievement-icon{font-size:18px}
.achievement-info{text-align:left}
.achievement-info h4{font-size:10px;font-weight:800;color:#1F2937;margin:0;font-family:'Space Grotesk';text-transform:uppercase;letter-spacing:0.5px}
.achievement-info p{font-size:9px;color:#6B7280;margin:0;line-height:1.1}

@media (max-width: 600px) {
  .achievement-card { flex: 0 1 calc(50% - 8px); }
}
</style>
</head>
<body>
<!-- BARRA DE PROGRESO FIJA -->
<div id="progressBar" style="display:none">
  <span class="pb-label">📓</span>
  <div class="pb-dots" id="pbDots"></div>
  <div class="pb-track"><div class="pb-fill" id="pbFill" style="width:0%"></div></div>
  <span class="pb-count" id="pbCount">0/10</span>
</div>

<div id="app"><p style="text-align:center;padding:60px;color:#6B7280">Cargando...</p></div>
<div id="confettiBox"></div>

<script>

// Auth check - redirect to index if not authenticated
function getDayOfYear(){
  var now = new Date();
  var start = new Date(now.getFullYear(), 0, 0);
  var diff = now - start;
  return Math.floor(diff / (1000*60*60*24));
}
function getTodayPassword(){
  return "campusvvb" + (getDayOfYear() * 27);
}
var auth = sessionStorage.getItem("campus_auth");
if(auth !== getTodayPassword() && auth !== "1126"){
  window.location.href = "index.html";
}
var D = null;

function loadData(){
  var params = new URLSearchParams(window.location.search);
  var archivo = params.get("datos") || "datos/economia_u1.json";
  fetch(archivo)
    .then(function(r){ 
      if(!r.ok) throw new Error("No se encontr\u00f3 " + archivo);
      return r.json(); 
    })
    .then(async function(data){ 
      D = data; 
      D = data; 
      // Cargar datos de autotest y estado S desde Supabase
      AUTOTEST_DATA = await obtenerDatosAutotest();
      await sincronizarEstadoDesdeSupabase();
      render(); 
      actualizarBarra(); 
      // Sincronizar progreso desde Supabase
      sincronizarProgresoDesdeSupabase();
    })
    .catch(function(e){
      document.getElementById("app").innerHTML = '<div style="text-align:center;padding:40px">'
        +'<p style="font-size:48px;margin-bottom:16px">\u26a0\ufe0f</p>'
        +'<p style="font-size:18px;font-weight:700;color:#EF4444">No se pudo cargar los datos</p>'
        +'<p style="font-size:14px;color:#6B7280;margin-top:8px">Archivo: <code>'+archivo+'</code></p>'
        +'<p style="font-size:13px;color:#9CA3AF;margin-top:16px">Asegurate de abrir con un servidor local:</p>'
        +'<p style="font-size:13px;color:#6366F1;margin-top:4px"><code>python3 -m http.server</code></p>'
        +'<p style="font-size:13px;color:#9CA3AF;margin-top:4px">y abrir <code>http://localhost:8000</code></p>'
        +'</div>';
    });
}

var CT=0, S={};
var AUTOTEST_DATA = null; // Datos del autotest desde Supabase (se carga al inicio)

// ===== CHECKLIST DE SECCIONES =====
var TAB_KEYS=["umbral","mapa","nucleo_a","nucleo_b","nucleo_c","senales","sabias","cruces","relectura","emocional","autotest","cierre"];
var TAB_LABELS=["Umbral","Mapa","Núcleo A","Núcleo B","Núcleo C","Señales","Sabías","Cruces","Relectura","Emocional","Autotest","Cierre"];
var TAB_EMOJIS=["🚪","🗺️","⚛️","⚛️","⚛️","🚦","✨","🔀","📖","🫶","📝","🔚"];
function getCheckKey(tabKey){
  if(!D) return null;
  return "campus_check_" + (D.id||D.materia+"_u"+D.unidad) + "_" + tabKey;
}
function isChecked(tabKey){
  return localStorage.getItem(getCheckKey(tabKey)) === "1";
}
function getCheckedCount(){
  return TAB_KEYS.filter(function(k){ return isChecked(k); }).length;
}
function marcarSeccion(tabKey){
  var nombre = TAB_LABELS[TAB_KEYS.indexOf(tabKey)];
  if(isChecked(tabKey)) return;
  var ok = confirm("¿Marcás la sección " + nombre + " como completada?\n\n⚠️ Esta acción no se puede deshacer.");
  if(!ok) return;
  localStorage.setItem(getCheckKey(tabKey), "1");
  // Guardar en Supabase si está activo
  if(typeof SUPABASE_ACTIVO !== "undefined" && SUPABASE_ACTIVO){
    trackProgreso(tabKey, undefined, S);
  }
  actualizarBarra();
  render(); // re-render para mostrar el estado done
}
function actualizarBarra(){
  if(!D) return;
  var count = getCheckedCount();
  var pct = count / TAB_KEYS.length * 100;
  document.getElementById("pbFill").style.width = pct + "%";
  document.getElementById("pbCount").textContent = count + "/12";
  document.getElementById("progressBar").style.display = "flex";

  // Puntos
  var dotsHtml = "";
  for(var i=0;i<TAB_KEYS.length;i++){
    var done = isChecked(TAB_KEYS[i]);
    var active = (i === CT);
    var cls = done ? "pb-dot done" : active ? "pb-dot active" : "pb-dot";
    var label = TAB_EMOJIS[i] + " " + TAB_LABELS[i];
    dotsHtml += '<div class="' + cls + '" title="' + label + '">' + (done ? '✓' : '') + '</div>';
  }
  document.getElementById("pbDots").innerHTML = dotsHtml;
}

function renderCheckBtn(tabKey){
  var nombre = TAB_LABELS[TAB_KEYS.indexOf(tabKey)];
  if(isChecked(tabKey)){
    return '<div class="check-section-done">\u2705 ' + nombre + ' completada</div>';
  }
  return '<button class="check-section-btn" onclick="marcarSeccion(\'' + tabKey + '\')">' +
    '<span style="font-size:20px">\u2611\ufe0f</span> Marcar ' + nombre + ' como completada' +
    '</button>';
}

// HELPER: Mostrar referencias de páginas
function mostrarPaginas(paginas) {
  if (!paginas) return '';
  return '<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;background:#EEF2FF;color:#6366F1;font-size:11px;font-weight:700;margin-left:8px">📄 Págs. ' + paginas + '</span>';
}

var TABS=[
{k:"umbral",i:"\u{1F6AA}",l:"UMBRAL",c:"#F59E0B",g:"linear-gradient(135deg,#F59E0B,#D97706)"},
{k:"mapa",i:"\u{1F5FA}\uFE0F",l:"MAPA",c:"#0EA5E9",g:"linear-gradient(135deg,#0EA5E9,#0284C7)"},
{k:"nucleo_a",i:"\u269B\uFE0F",l:"N\u00daCLEO A",c:"#6366F1",g:"linear-gradient(135deg,#6366F1,#4F46E5)"},
{k:"nucleo_b",i:"\u269B\uFE0F",l:"N\u00daCLEO B",c:"#3B82F6",g:"linear-gradient(135deg,#3B82F6,#2563EB)"},
{k:"nucleo_c",i:"\u269B\uFE0F",l:"N\u00daCLEO C",c:"#10B981",g:"linear-gradient(135deg,#10B981,#059669)"},
{k:"senales",i:"\u{1F6A6}",l:"SE\u00d1ALES",c:"#F97316",g:"linear-gradient(135deg,#F97316,#EA580C)"},
{k:"sabias",i:"\u2728",l:"SAB\u00cdAS",c:"#EC4899",g:"linear-gradient(135deg,#EC4899,#DB2777)"},
{k:"cruces",i:"\u{1F500}",l:"CRUCES",c:"#14B8A6",g:"linear-gradient(135deg,#14B8A6,#0D9488)"},
{k:"relectura",i:"\u{1F4D6}",l:"RELECTURA",c:"#7C3AED",g:"linear-gradient(135deg,#7C3AED,#6D28D9)"},
{k:"emocional",i:"\u{1FAF6}",l:"EMOCIONAL",c:"#EC4899",g:"linear-gradient(135deg,#EC4899,#DB2777)"},
{k:"autotest",i:"\u{1F4DD}",l:"AUTOTEST",c:"#F59E0B",g:"linear-gradient(135deg,#F59E0B,#D97706)"},
{k:"cierre",i:"\u{1F51A}",l:"CIERRE",c:"#6366F1",g:"linear-gradient(135deg,#6366F1,#4F46E5)"}
];


function switchTab(i){CT=i;render();}
function uN7(sk){
  var s=S[sk], d=D[sk.split("_")[0]].n7_defini_con_tus_palabras, c=d.conceptos[s.cur];
  var matched=c.palabras_clave.filter(function(k){return s.inp.toLowerCase().indexOf(k)>=0});
  var q=matched.length, btn=document.getElementById("btn_enviar_"+sk), dots=document.getElementById("qdots_"+sk);
  if(btn) btn.disabled=s.inp.length<5;
  if(dots && s.inp.length>10){
    var h=""; for(var l=1;l<=3;l++) h+='<div style="flex:1;height:4px;border-radius:4px;background:'+(q>=l?'#10B981':'#E5E7EB')+'"></div>';
    dots.innerHTML=h; dots.style.display="flex";
  } else if(dots) { dots.innerHTML=""; }
}
function uN10(sk){
  var s=S[sk], f=[s.s1,s.s2,s.d1,s.d2,s.d3,s.d4].filter(function(v){return v.trim().length>3}).length;
  var bar=document.getElementById("barfill_"+sk), txt=document.getElementById("txt_"+sk);
  if(bar) bar.style.width=(f/6*100)+"%"; if(txt) txt.textContent=f+"/6";
}
function tog(id){S["o_"+id]=!S["o_"+id];render();}

function secHeader(icon,title,sub,grad){
  return '<div class="sh" style="background:'+grad+'"><div class="big">'+icon+'</div><p style="font-size:14px;font-weight:700;opacity:.7;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Secci\u00f3n</p><h2>'+icon+' '+title+'</h2><p>'+sub+'</p></div>';
}

function actWrap(id,title,desc,level,color,content,defOpen){
  var open=S["o_"+id]!==undefined?S["o_"+id]:(defOpen||false);
  var h='<div class="card">';
  h+='<div class="cardh" onclick="tog(\''+id+'\')" style="border-left:4px solid '+color+';'+(open?'background:'+color+'08':'')+'">';
  h+='<div><h4>'+title+'</h4><small>'+desc+'</small></div>';
  h+='<div style="display:flex;align-items:center;gap:10px">';
  h+='<span class="badge" style="background:'+color+'18;color:'+color+'">'+level+'</span>';
  h+='<span class="arrow '+(open?'open':'')+'">&#9660;</span>';
  h+='</div></div>';
  if(open) h+='<div class="body">'+content+'</div>';
  h+='</div>';
  return h;
}

function fireConfetti(){
  var b=document.getElementById("confettiBox");
  b.innerHTML="";
  var colors=["#FF6B6B","#4ECDC4","#FFE66D","#A78BFA","#F472B6","#34D399"];
  for(var i=0;i<30;i++){
    var p=document.createElement("div");
    p.style.cssText="position:absolute;top:-20px;animation:confetti 1.2s ease-out forwards;opacity:0;left:"+Math.random()*100+"%;width:"+(4+Math.random()*6)+"px;height:"+(4+Math.random()*6)+"px;background:"+colors[Math.floor(Math.random()*colors.length)]+";border-radius:"+(Math.random()>.5?"50%":"1px")+";animation-delay:"+Math.random()*0.3+"s";
    b.appendChild(p);
  }
  setTimeout(function(){b.innerHTML=""},1500);
}

function cerrarSesion(){
  // Limpiar todo storage
  sessionStorage.clear();
  localStorage.clear();
  // Volver al index
  window.location.href = "index.html";
}

function render(){
  if(!D) return;
  var t=TABS[CT];
  
  // 👤 Obtener info del usuario
  var esDocente = sessionStorage.getItem("campus_auth") === "1126" || sessionStorage.getItem("is_docente") === "true";
  var nombreAlumno = localStorage.getItem("campus_alumno_nombre") || "";
  var saludo = esDocente ? "👨‍🏫 Hola Profe" : (nombreAlumno ? "👋 Hola " + nombreAlumno : "");
  
  var h='<div class="hdr">';
  
  // Fila superior: Volver + Saludo + Logout
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  h+='<a href="index.html" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:10px;border:1px solid #E5E7EB;background:#fff;color:#6B7280;font-size:13px;font-weight:600;text-decoration:none">\u2190 Volver</a>';
  
  if(saludo){
    h+='<div style="display:flex;align-items:center;gap:10px">';
    h+='<span style="font-size:14px;font-weight:600;color:#6B7280">'+saludo+'</span>';
    if(esDocente){
      h+='<a href="panel-docente.html" style="padding:6px 14px;border-radius:10px;border:1px solid #6366F1;background:#EEF2FF;color:#6366F1;font-size:13px;font-weight:600;text-decoration:none">📊 Panel</a>';
    }
    h+='<button onclick="cerrarSesion()" style="padding:6px 14px;border-radius:10px;border:1px solid #E5E7EB;background:#fff;color:#EF4444;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">🚪 Salir</button>';
    h+='</div>';
  }
  
  h+='</div>';
  
  h+='<span style="font-size:32px">\u{1F4D3}</span> ';
  h+='<h1 style="display:inline;background:linear-gradient(135deg,'+D.color_primario+','+D.color_secundario+');-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">'+D.materia+'</h1>';
  h+='<p style="font-size:14px;color:#6B7280;margin-top:4px">'+D.emoji+' Unidad '+D.unidad+': '+D.titulo+'</p>';
  h += renderMedallas();
  h+='</div>';
  
  h+='<div class="tabs">';
  for(var i=0;i<TABS.length;i++){
    var tb=TABS[i];
    var isOn=i===CT;
    var isDone=isChecked(tb.k);
    var dotHtml=isDone?' <span style="width:7px;height:7px;border-radius:50%;background:#10B981;display:inline-block;vertical-align:middle;margin-left:2px"></span>':'';
    h+='<button class="tab '+(isOn?"on":"")+'" onclick="switchTab('+i+')" style="'+(isOn?'background:'+tb.g+';box-shadow:0 4px 15px '+tb.c+'40':'')+'">'+tb.i+' '+tb.l+dotHtml+'</button>';
  }
  h+='</div>';
  
  h+='<div class="cnt">'+renderFeedback()+renderSection()+'</div>';
  h+='<div class="foot">\u{1F4A1} <strong>Campus Cuaderno Vivo</strong> \u2014 '+D.materia+' \u00b7 Unidad '+D.unidad+'</div>';
  
  document.getElementById("app").innerHTML=h;
  actualizarBarra();
}

function renderFeedback(){
  var tabK = TABS[CT].k;
  var msg = window.DOCENTE_FEEDBACK && window.DOCENTE_FEEDBACK[tabK];
  if(!msg) return '';
  return '<div class="docente-feedback"><p>'+msg+'</p></div>';
}

function renderMedallas(){
  var m1 = isChecked("umbral");
  var m2 = isChecked("nucleo_a") && isChecked("nucleo_b") && isChecked("nucleo_c");

function rAT(){
  var d=D.autotest.preguntas, tq=d.length;
  var vf=D.autotest.verdadero_falso || [], vfq=vf.length;
  var totalPreguntas = tq + vfq;
  
  if(!S.at) S.at={cur:0,ans:{},fin:false,started:false};
  var s=S.at;
  
  // Verificar si es docente (por clave 1126 O por flag is_docente)
  var esDocente = sessionStorage.getItem("campus_auth") === "1126" || sessionStorage.getItem("is_docente") === "true";
  
  // Generar banco de respuestas para docente
  var bancoHtml = '';
  if(esDocente && D.autotest.banco_respuestas_docente){
    bancoHtml='<div style="padding:16px 20px;border-radius:14px;background:#FEF3C7;border:2px solid #F59E0B;margin-bottom:20px">';
    bancoHtml+='<p style="margin:0 0 10px;font-size:14px;font-weight:700;color:#92400E">🎓 BANCO DE RESPUESTAS (solo docente)</p>';
    bancoHtml+='<div style="font-size:12px;color:#78350F;line-height:1.8">';
    for(var i=0;i<D.autotest.banco_respuestas_docente.length;i++){
      bancoHtml+='<div>'+D.autotest.banco_respuestas_docente[i]+'</div>';
    }
    bancoHtml+='</div></div>';
  }
  
  // 🆕 Usar datos de Supabase en vez de localStorage
  var datosAutotest = AUTOTEST_DATA || {primeraVez: true, primerIntento: null, reintentos: []};
  var primeraVez = datosAutotest.primeraVez;
  var primerIntento = datosAutotest.primerIntento;
  var reintentos = datosAutotest.reintentos;
  
  // 🆕 ADVERTENCIA INICIAL (solo si nunca hizo el test)
  if(!s.started && !s.fin && primeraVez){
    var h='<div style="text-align:center;padding:30px 20px;max-width:500px;margin:0 auto">';
    h+='<div style="font-size:48px;margin-bottom:16px">⚠️</div>';
    h+='<h3 style="font-size:20px;font-weight:800;color:#DC2626;margin:0 0 12px">ATENCIÓN - PRIMER INTENTO</h3>';
    h+='<div style="text-align:left;background:#FEF3C7;padding:16px 20px;border-radius:14px;border:2px solid #F59E0B;margin-bottom:20px">';
    h+='<p style="margin:0 0 12px;font-size:14px;color:#78350F;line-height:1.6">Podés hacer este test <strong>todas las veces que quieras</strong>, pero tu <strong>PRIMERA NOTA</strong> es la que queda guardada en el registro docente.</p>';
    h+='<p style="margin:0;font-size:14px;color:#78350F;line-height:1.6">💡 <strong>Asegurate de haber repasado</strong> antes de empezar.</p>';
    h+='</div>';
    h+='<button class="btn" onclick="S.at.started=true;render()" style="background:linear-gradient(135deg,#DC2626,#B91C1C);font-size:15px;padding:12px 32px">Estoy listo/a, comenzar test 🚀</button>';
    h+='</div>';
    return bancoHtml + h;
  }
  
  // 🔄 PANTALLA PARA REINTENTOS (ya hizo el test antes)
  if(!s.started && !s.fin && !primeraVez){
    var primerNota = Math.round((primerIntento.nota / 100) * totalPreguntas) + '/' + totalPreguntas;
    var primerPct = primerIntento.nota;
    var intentosAnt = 1 + reintentos.length;
    var h='<div style="text-align:center;padding:30px 20px;max-width:500px;margin:0 auto">';
    h+='<div style="font-size:48px;margin-bottom:16px">🔄</div>';
    h+='<h3 style="font-size:20px;font-weight:800;color:#6366F1;margin:0 0 12px">REINTENTO DEL TEST</h3>';
    h+='<div style="text-align:left;background:#DBEAFE;padding:16px 20px;border-radius:14px;border:2px solid #3B82F6;margin-bottom:20px">';
    h+='<p style="margin:0 0 8px;font-size:14px;color:#1E40AF;line-height:1.6"><strong>Tu primera nota:</strong> '+primerNota+' ('+primerPct+'%)</p>';
    h+='<p style="margin:0;font-size:14px;color:#1E40AF;line-height:1.6">Ya hiciste este test '+intentosAnt+' vez/veces. Podés practicar cuantas veces quieras.</p>';
    h+='</div>';
    h+='<button class="btn" onclick="S.at.started=true;render()" style="font-size:15px;padding:12px 32px">Comenzar nuevo intento 🚀</button>';
    h+='</div>';
    return bancoHtml + h;
  }
  
  // Calcular puntaje (MC + V/F)
  var score=0;
  for(var k in s.ans){
    if(k.indexOf('vf_') === 0){
      // Es V/F
      var vfIdx = parseInt(k.replace('vf_',''));
      if(s.ans[k] === vf[vfIdx].correcto) score++;
    } else {
      // Es MC
      if(s.ans[k]===d[k].correcta) score++;
    }
  }
  var pct=Math.round(score/totalPreguntas*100);
  
  // PANTALLA FINAL - Resultados
  if(s.fin){
    var n=pct>=90?{e:"\u{1F3C6}",t:"\u00a1EXCELENTE!",c:"#10B981"}:pct>=70?{e:"\u{1F389}",t:"\u00a1Muy bien!",c:"#3B82F6"}:pct>=50?{e:"\u{1F44D}",t:"Aprobado",c:"#F59E0B"}:{e:"\u{1F4DA}",t:"Repasar",c:"#EF4444"};
    if(pct>=70) fireConfetti();
    
    // 🆕 GUARDAR RESULTADO EN SUPABASE (sin localStorage)
    var esPrimerIntento = datosAutotest.primeraVez;
    
    if(esPrimerIntento){
      // 🚀 GUARDAR EN SUPABASE (primer intento)
      trackProgreso("autotest_1er_intento", pct).then(function(){
        // Recargar datos para próximas veces
        obtenerDatosAutotest().then(function(datos){ AUTOTEST_DATA = datos; });
      });
    } else {
      // 🚀 GUARDAR EN SUPABASE (reintento)
      trackProgreso("autotest_reintento", pct).then(function(){
        // Recargar datos para próximas veces
        obtenerDatosAutotest().then(function(datos){ AUTOTEST_DATA = datos; });
      });
    }
    
    var totalIntentos = 1 + datosAutotest.reintentos.length + (esPrimerIntento ? 0 : 1);
    
    var h='<div style="text-align:center;padding:20px">';
    
    // Mostrar si es primera vez o reintento
    if(esPrimerIntento){
      h+='<div style="background:#DBEAFE;padding:8px 16px;border-radius:10px;margin-bottom:12px;border:2px solid #3B82F6">';
      h+='<p style="margin:0;font-size:13px;font-weight:700;color:#1E40AF">📌 Esta nota queda guardada como tu PRIMER INTENTO</p></div>';
    }else{
      var primerNota = Math.round((datosAutotest.primerIntento.nota / 100) * totalPreguntas) + '/' + totalPreguntas;
      var primerPct = datosAutotest.primerIntento.nota;
      h+='<div style="background:#FEF3C7;padding:8px 16px;border-radius:10px;margin-bottom:12px;border:2px solid #F59E0B">';
      h+='<p style="margin:0;font-size:13px;font-weight:600;color:#92400E">🔄 Intento #'+totalIntentos+' (tu primera nota fue: '+primerNota+' - '+primerPct+'%)</p></div>';
    }
    
    h+='<div style="width:100px;height:100px;border-radius:50%;background:'+n.c+'15;border:4px solid '+n.c+';display:flex;align-items:center;justify-content:center;margin:0 auto 16px">';
    h+='<span style="font-size:32px;font-weight:900;color:'+n.c+'">'+Math.round(pct/10)+'</span></div>';
    h+='<span style="font-size:28px">'+n.e+'</span>';
    h+='<p style="margin:8px 0;font-size:20px;font-weight:800;color:'+n.c+'">'+n.t+'</p>';
    h+='<p style="margin:0;font-size:14px;color:#6B7280">'+score+'/'+totalPreguntas+' correctas ('+pct+'%)</p>';
    h+='<button class="btn" onclick="S.at={cur:0,ans:{},fin:false,started:true};render()" style="margin-top:20px">Reintentar</button></div>';
    return bancoHtml + h;
  }
  
  // PANTALLA DE PREGUNTA
  // Si cur < tq → mostrar MC
  // Si cur >= tq → mostrar V/F
  
  if(s.cur < tq){
    // ========== MULTIPLE CHOICE ==========
    var p=d[s.cur], answered=s.ans[s.cur]!==undefined, ok=answered&&s.ans[s.cur]===p.correcta;
    var h='<div style="display:flex;justify-content:space-between;margin-bottom:12px">';
    h+='<span style="font-size:13px;font-weight:700;color:#6366F1">Pregunta '+(s.cur+1)+'/'+totalPreguntas+'</span>';
    h+='<div style="display:flex;gap:4px">';
    for(var i=0;i<totalPreguntas;i++){
      var isDone = i < tq ? (s.ans[i] !== undefined) : (s.ans['vf_' + (i-tq)] !== undefined);
      var isCorrect = false;
      if(isDone){
        if(i < tq){
          isCorrect = s.ans[i] === d[i].correcta;
        } else {
          var vfIdx = i - tq;
          isCorrect = s.ans['vf_'+vfIdx] === vf[vfIdx].correcto;
        }
      }
      h+='<div style="width:10px;height:10px;border-radius:50%;background:'+(i===s.cur?'#6366F1':isCorrect?'#10B981':isDone?'#EF4444':'#E5E7EB')+'"></div>';
    }
    h+='</div></div>';
    h+='<div style="padding:16px;border-radius:14px;background:#F5F3FF;margin-bottom:14px"><p style="margin:0;font-size:15px;font-weight:700;color:#374151">'+p.pregunta+'</p></div>';
    
    for(var j=0;j<p.opciones.length;j++){
      var opt=p.opciones[j], iSel=s.ans[s.cur]===j;
      var isCorrect=answered&&j===p.correcta;
      var isWrong=iSel&&!ok;
      h+='<div onclick="if(S.at.ans[S.at.cur]===undefined){S.at.ans[S.at.cur]='+j+';render()}" style="padding:12px 16px;border-radius:12px;border:'+(isCorrect?'2px solid #10B981':isWrong?'2px solid #EF4444':iSel?'2px solid #6366F1':'2px solid #E5E7EB')+';background:'+(isCorrect?'#ECFDF5':isWrong?'#FEF2F2':iSel?'#EEF2FF':'#fff')+';cursor:'+(answered?'default':'pointer')+';display:flex;align-items:center;gap:10px;margin-bottom:8px">';
      h+='<span style="width:28px;height:28px;border-radius:50%;border:2px solid '+(isCorrect?'#10B981':isWrong?'#EF4444':'#D1D5DB')+';background:'+(isCorrect?'#10B981':isWrong?'#EF4444':'transparent')+';color:'+(isCorrect||isWrong?'#fff':'#6B7280')+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">'+(isCorrect?'\u2713':isWrong?'\u2717':String.fromCharCode(65+j))+'</span>';
      h+='<span style="font-size:14px;font-weight:'+(iSel?600:400)+'">'+opt+'</span></div>';
    }
    
    if(answered){
      h+='<div class="fb" style="background:'+(ok?'#D1FAE5':'#FEF3C7')+'"><p style="margin:0;font-size:13px;color:'+(ok?'#065F46':'#92400E')+'">'+(ok?'\u2728 ':'\u{1F4D6} ')+p.explicacion+'</p></div>';
      h+='<button class="btn" onclick="S.at.cur++;render()">'+(s.cur<tq-1?'Siguiente \u2192':'Pasar a V/F \u2192')+'</button>';
    }
    
    return bancoHtml + h;
    
  } else {
    // ========== VERDADERO / FALSO ==========
    var vfIdx = s.cur - tq;
    
    // Si ya terminó todas las V/F, mostrar resultados
    if(vfIdx >= vfq){
      s.fin = true;
      return render(); // Re-renderizar para mostrar pantalla final
    }
    
    var vfItem = vf[vfIdx];
    var vfKey = 'vf_' + vfIdx;
    var answered = s.ans[vfKey] !== undefined;
    var ok = answered && s.ans[vfKey] === vfItem.correcto;
    
    var h='<div style="display:flex;justify-content:space-between;margin-bottom:12px">';
    h+='<span style="font-size:13px;font-weight:700;color:#6366F1">Pregunta '+(s.cur+1)+'/'+totalPreguntas+' (Verdadero/Falso)</span>';
    h+='<div style="display:flex;gap:4px">';
    for(var i=0;i<totalPreguntas;i++){
      var isDone = i < tq ? (s.ans[i] !== undefined) : (s.ans['vf_' + (i-tq)] !== undefined);
      var isCorrect = false;
      if(isDone){
        if(i < tq){
          isCorrect = s.ans[i] === d[i].correcta;
        } else {
          var vfI = i - tq;
          isCorrect = s.ans['vf_'+vfI] === vf[vfI].correcto;
        }
      }
      h+='<div style="width:10px;height:10px;border-radius:50%;background:'+(i===s.cur?'#6366F1':isCorrect?'#10B981':isDone?'#EF4444':'#E5E7EB')+'"></div>';
    }
    h+='</div></div>';
    h+='<div style="padding:16px;border-radius:14px;background:#FFF7ED;margin-bottom:14px;border:2px solid #F59E0B">';
    h+='<p style="margin:0;font-size:15px;font-weight:700;color:#374151">'+vfItem.texto+'</p></div>';
    
    // Botones V/F
    var selV = s.ans[vfKey] === true;
    var selF = s.ans[vfKey] === false;
    var isCorrectV = answered && vfItem.correcto === true;
    var isCorrectF = answered && vfItem.correcto === false;
    var isWrongV = selV && !ok;
    var isWrongF = selF && !ok;
    
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">';
    h+='<div onclick="if(S.at.ans[\''+vfKey+'\']===undefined){S.at.ans[\''+vfKey+'\']=true;render()}" style="padding:16px;border-radius:12px;border:'+(isCorrectV?'3px solid #10B981':isWrongV?'3px solid #EF4444':selV?'2px solid #6366F1':'2px solid #E5E7EB')+';background:'+(isCorrectV?'#ECFDF5':isWrongV?'#FEF2F2':selV?'#EEF2FF':'#fff')+';cursor:'+(answered?'default':'pointer')+';text-align:center;font-size:16px;font-weight:700">';
    h+='<div style="font-size:24px;margin-bottom:6px">'+(isCorrectV?'\u2713':isWrongV?'\u2717':'\u2705')+'</div>VERDADERO</div>';
    h+='<div onclick="if(S.at.ans[\''+vfKey+'\']===undefined){S.at.ans[\''+vfKey+'\']=false;render()}" style="padding:16px;border-radius:12px;border:'+(isCorrectF?'3px solid #10B981':isWrongF?'3px solid #EF4444':selF?'2px solid #6366F1':'2px solid #E5E7EB')+';background:'+(isCorrectF?'#ECFDF5':isWrongF?'#FEF2F2':selF?'#EEF2FF':'#fff')+';cursor:'+(answered?'default':'pointer')+';text-align:center;font-size:16px;font-weight:700">';
    h+='<div style="font-size:24px;margin-bottom:6px">'+(isCorrectF?'\u2713':isWrongF?'\u2717':'\u274C')+'</div>FALSO</div>';
    h+='</div>';
    
    if(answered){
      h+='<div class="fb" style="background:'+(ok?'#D1FAE5':'#FEF3C7')+'"><p style="margin:0;font-size:13px;color:'+(ok?'#065F46':'#92400E')+'">'+(ok?'\u2728 ':'\u{1F4D6} ')+vfItem.explicacion+'</p></div>';
      var isLastVF = vfIdx >= vfq - 1;
      h+='<button class="btn" onclick="S.at.cur++;render()">'+(isLastVF?'Ver mi nota \u2192':'Siguiente \u2192')+'</button>';
    }
    
    return bancoHtml + h;
  }
}

async function verificarAlumno(){
  var codigo = document.getElementById("alumnoCodigo").value.trim().toLowerCase();
  if(!codigo) return;
  
  // 🔑 Si ingresa 1126, es docente
  if(codigo === "1126"){
    sessionStorage.setItem("campus_auth", "1126");
    localStorage.setItem("campus_alumno_codigo", "docente_1126"); // Para que no trackee
    localStorage.setItem("campus_alumno_nombre", "Docente");
    document.getElementById("alumnoLoginOverlay").remove();
    return;
  }

  try {
    var r = await fetch(SUPABASE_URL + "/rest/v1/alumnos?codigo=eq." + codigo + "&select=*", {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    var data = await r.json();

    if(data && data.length > 0){
      var alumno = data[0];
      localStorage.setItem("campus_alumno_codigo", alumno.codigo);
      sessionStorage.setItem("alumno_codigo", alumno.codigo);
      localStorage.setItem("campus_alumno_nombre", alumno.nombre);
      localStorage.setItem("campus_alumno_curso", alumno.curso);
      document.getElementById("alumnoLoginOverlay").remove();
      registrarSesion(alumno.codigo);
      mostrarBienvenida(alumno.nombre);
    } else {
      document.getElementById("alumnoLoginError").style.display = "block";
    }
  } catch(e){
    // Si falla la conexión, igual dejamos entrar (modo offline)
    console.warn("Supabase no disponible, modo offline");
    document.getElementById("alumnoLoginOverlay").remove();
  }
}

// ----- REGISTRAR SESIÓN -----
async function registrarSesion(codigo){
  var hoy = new Date().toDateString();
  var ultimaSesion = localStorage.getItem("campus_ultima_sesion");
  if(ultimaSesion === hoy) return; // solo 1 sesión por día
  localStorage.setItem("campus_ultima_sesion", hoy);
  if(!SUPABASE_ACTIVO) return; // sin Supabase configurado, solo localStorage

  try {
    await fetch(SUPABASE_URL + "/rest/v1/sesiones", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ alumno_codigo: codigo })
    });
  } catch(e){ console.warn("No se pudo registrar sesión"); }
}

// ----- REGISTRAR PROGRESO -----
// Llamá a esta función cuando el alumno completa una sección
// Ejemplo: trackProgreso("nucleo") — se llama automáticamente al cambiar de tab
async function trackProgreso(seccion, nota, datos){
  var codigo = getAlumnoCodigo();
  if(!D) return;

  // Guardar en localStorage siempre (funciona offline y sin Supabase)
  var lsKey = "campus_prog_" + D.id + "_" + seccion;
  var yaGuardado = localStorage.getItem(lsKey);
  if(yaGuardado && nota === undefined) return;
  localStorage.setItem(lsKey, JSON.stringify({fecha: new Date().toISOString(), nota: nota||null}));

  // Enviar a Supabase solo si está configurado y el alumno está identificado
  if(!SUPABASE_ACTIVO || !codigo) return;

  try {
    var payload = {
      alumno_codigo: codigo,
      materia: D.materia,
      unidad: D.id,
      seccion: seccion,
      completada: true
    };
    if(nota !== undefined) payload.nota = nota;
    if(datos !== undefined) payload.datos = datos;

    await fetch(SUPABASE_URL + "/rest/v1/progreso", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(payload)
    });
  } catch(e){ console.warn("No se pudo guardar en Supabase, queda en localStorage"); }
}

// ----- OBTENER DATOS DE AUTOTEST DESDE SUPABASE -----
async function obtenerDatosAutotest(){
  if(!SUPABASE_ACTIVO || !D) return {primeraVez: true, primerIntento: null, reintentos: []};
  
  var codigo = getAlumnoCodigo();
  if(!codigo || codigo === "docente_1126") return {primeraVez: true, primerIntento: null, reintentos: []}; // Docente no trackea
  
  try {
    var url = SUPABASE_URL + "/rest/v1/progreso?alumno_codigo=eq." + codigo + 
              "&materia=eq." + encodeURIComponent(D.materia) +
              "&unidad=eq." + encodeURIComponent(D.id) +
              "&seccion=like.autotest*" +
              "&select=*&order=fecha.asc";
    
    var r = await fetch(url, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });
    
    var data = await r.json();
    
    var primerIntento = data.find(function(d){ return d.seccion === "autotest_1er_intento"; });
    var reintentos = data.filter(function(d){ return d.seccion === "autotest_reintento"; });
    
    return {
      primeraVez: !primerIntento,
      primerIntento: primerIntento,
      reintentos: reintentos
    };
  } catch(e){
    console.warn("Error al obtener datos de autotest:", e);
    return {primeraVez: true, primerIntento: null, reintentos: []};
  }
}

// ----- SINCRONIZAR PROGRESO DESDE SUPABASE -----
// Lee el progreso guardado en Supabase y lo copia a localStorage
async function sincronizarProgresoDesdeSupabase(){
  if(!SUPABASE_ACTIVO || !D) return;
  
  var codigo = getAlumnoCodigo();
  if(!codigo) return;

  try {
    var url = SUPABASE_URL + "/rest/v1/progreso?alumno_codigo=eq." + codigo + 
              "&materia=eq." + encodeURIComponent(D.materia) + 
              "&unidad=eq." + encodeURIComponent(D.id) + 
              "&select=*";
    
    var response = await fetch(url, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    var registros = await response.json();
    
    // Copiar cada registro de Supabase a localStorage
    registros.forEach(function(reg){
      if(reg.completada){
        var lsKey = "campus_prog_" + D.id + "_" + reg.seccion;
        localStorage.setItem(lsKey, JSON.stringify({
          fecha: reg.created_at || new Date().toISOString(),
          nota: reg.nota || null
        }));
        
        // También marcar en el sistema de checklist
        var checkKey = "campus_check_" + D.id + "_" + reg.seccion;
        localStorage.setItem(checkKey, "1");
      }
    });
    
    // Actualizar la barra de progreso después de sincronizar
    actualizarBarra();
    
  } catch(e){ 
    console.warn("No se pudo sincronizar desde Supabase:", e); 
  }
}

var _saveTimeout = null;
function autoGuardarS(){
  if(_saveTimeout) clearTimeout(_saveTimeout);
  console.log("Pendiente de guardado...");

        },
        body: JSON.stringify({
          alumno_codigo: codigo,
          materia: D.materia,
          unidad: D.id,
          seccion: "__ESTADO_UNIDAD__",
          datos: S,

    } catch(e){ console.warn("Error al guardar estado en la nube"); }
  }, 2000);

// Interceptar cambios en S para disparar autoguardado
var _S = S;
S = new Proxy(_S, {
  get(target, prop) {
    if (typeof target[prop] === 'object' && target[prop] !== null) {
      return new Proxy(target[prop], this);
    }
    return target[prop];
  },
  set(target, prop, value) {
    target[prop] = value;
    autoGuardarS();
    return true;
  }
});

async function sincronizarEstadoDesdeSupabase(){
  if(!SUPABASE_ACTIVO || !D) return;
  var codigo = getAlumnoCodigo();
  if(!codigo) return;
  try {
    var url = SUPABASE_URL + "/rest/v1/progreso?alumno_codigo=eq." + codigo + 
              "&materia=eq." + encodeURIComponent(D.materia) + 
              "&unidad=eq." + encodeURIComponent(D.id) + "&select=seccion,datos,comentario_docente";
    
    var response = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    var data = await response.json();
    
    window.DOCENTE_FEEDBACK = {}; // Limpiar previos
    if(data && data.length > 0){
      data.forEach(function(p){
        if(p.seccion === "__ESTADO_UNIDAD__" && p.datos){
          Object.assign(_S, p.datos);
        } else if(p.comentario_docente){
          window.DOCENTE_FEEDBACK[p.seccion] = p.comentario_docente;
        }
      });
      console.log("Avance y comentarios recuperados ☁️");
    }
  } catch(e){ console.warn("No se pudo sincronizar desde Supabase:", e); }
}

// Agrega indicadores visuales en los tabs del alumno
function actualizarIndicadoresTabs(){
  if(!D) return;
  var tabs = document.querySelectorAll(".tab");
  var tabKeys = ["umbral","mapa","nucleo_a","nucleo_b","nucleo_c","senales","sabias","cruces","relectura","emocional","autotest","cierre"];
  tabs.forEach(function(tab, i){
    if(i >= tabKeys.length) return;
    var lsKey = "campus_prog_" + D.id + "_" + tabKeys[i];
    if(localStorage.getItem(lsKey)){
      if(!tab.querySelector(".check-done")){
        var dot = document.createElement("span");
        dot.className = "check-done";
        dot.style.cssText = "width:8px;height:8px;border-radius:50%;background:#34D399;display:inline-block;margin-left:4px;flex-shrink:0";
        tab.appendChild(dot);
      }
    }
  });
}
