<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Cuaderno Vivo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'DM Sans',sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#F8FAFC 0%,#EEF2FF 50%,#FFF7ED 100%);padding:20px 16px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes confetti{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(-120px) translateX(30px) rotate(360deg)}}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
.hdr{text-align:center;margin-bottom:28px}
.hdr h1{font-size:26px;font-weight:800;letter-spacing:-1px;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tabs{display:flex;gap:4px;margin-bottom:24px;justify-content:center;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:12px;border:none;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .3s}
.tab.on{color:#fff;transform:scale(1.05)}.tab:not(.on){background:#fff;color:#6B7280;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cnt{max-width:600px;margin:0 auto}
.sh{padding:28px 32px;border-radius:20px 20px 0 0;position:relative;overflow:hidden;color:#fff}
.sh .big{position:absolute;top:-30px;right:-20px;font-size:100px;opacity:.1;transform:rotate(12deg)}
.sh h2{font-size:28px;font-weight:800;letter-spacing:-.5px}
.sh p{font-size:14px;opacity:.8;margin-top:6px}
.sb{padding:20px;background:#fff;border-radius:0 0 20px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
.card{background:#fff;border-radius:16px;border:1px solid #E5E7EB;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cardh{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.cardh h4{font-size:16px;font-weight:700;color:#1F2937;margin:0}
.cardh small{font-size:13px;color:#6B7280}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.arrow{transition:transform .3s;font-size:18px;color:#9CA3AF}.arrow.open{transform:rotate(180deg)}
.body{padding:20px;border-top:1px solid #F3F4F6;animation:fadeIn .3s}
.btn{display:block;margin:14px auto 0;padding:10px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn:disabled{background:#D1D5DB;cursor:not-allowed;box-shadow:none}
.btn2{padding:6px 16px;border-radius:8px;border:none;background:#6366F1;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
textarea{width:100%;padding:12px;border-radius:10px;border:2px solid #E5E7EB;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;resize:vertical;min-height:65px;box-sizing:border-box}
textarea:focus{border-color:#C7D2FE}
input[type=text]{width:100%;padding:10px 14px;border-radius:10px;border:2px solid #E5E7EB;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box}
.bar{height:6px;border-radius:6px;background:#E5E7EB;overflow:hidden}.barfill{height:100%;border-radius:6px;transition:width .5s}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;animation:fadeIn .3s}
.foot{margin-top:28px;padding:20px;border-radius:16px;background:#F9FAFB;border:1px dashed #D1D5DB;text-align:center;font-size:13px;color:#6B7280}
</style>
</head>
<body>
<div id="app"><p style="text-align:center;padding:60px;color:#6B7280">Cargando...</p></div>
<div id="confettiBox"></div>

<script>
var D = null;

function loadData(){
  var params = new URLSearchParams(window.location.search);
  var archivo = params.get("datos") || "datos/economia_u1.json";
  fetch(archivo)
    .then(function(r){ 
      if(!r.ok) throw new Error("No se encontr\u00f3 " + archivo);
      return r.json(); 
    })
    .then(function(data){ D = data; render(); })
    .catch(function(e){
      document.getElementById("app").innerHTML = '<div style="text-align:center;padding:40px">'
        +'<p style="font-size:48px;margin-bottom:16px">\u26a0\ufe0f</p>'
        +'<p style="font-size:18px;font-weight:700;color:#EF4444">No se pudo cargar los datos</p>'
        +'<p style="font-size:14px;color:#6B7280;margin-top:8px">Archivo: <code>'+archivo+'</code></p>'
        +'<p style="font-size:13px;color:#9CA3AF;margin-top:16px">Asegurate de abrir con un servidor local:</p>'
        +'<p style="font-size:13px;color:#6366F1;margin-top:4px"><code>python3 -m http.server</code></p>'
        +'<p style="font-size:13px;color:#9CA3AF;margin-top:4px">y abrir <code>http://localhost:8000</code></p>'
        +'</div>';
    });
}

var CT=0, S={};
var TABS=[
{k:"umbral",i:"\u{1F6AA}",l:"UMBRAL",c:"#F59E0B",g:"linear-gradient(135deg,#F59E0B,#D97706)"},
{k:"mapa",i:"\u{1F5FA}\uFE0F",l:"MAPA",c:"#0EA5E9",g:"linear-gradient(135deg,#0EA5E9,#0284C7)"},
{k:"nucleo",i:"\u269B\uFE0F",l:"N\u00daCLEO",c:"#6366F1",g:"linear-gradient(135deg,#6366F1,#4F46E5)"},
{k:"senales",i:"\u{1F6A6}",l:"SE\u00d1ALES",c:"#F97316",g:"linear-gradient(135deg,#F97316,#EA580C)"},
{k:"sabias",i:"\u2728",l:"SAB\u00cdAS",c:"#EC4899",g:"linear-gradient(135deg,#EC4899,#DB2777)"},
{k:"cruces",i:"\u{1F500}",l:"CRUCES",c:"#14B8A6",g:"linear-gradient(135deg,#14B8A6,#0D9488)"},
{k:"relectura",i:"\u{1F4D6}",l:"RELECTURA",c:"#7C3AED",g:"linear-gradient(135deg,#7C3AED,#6D28D9)"},
{k:"emocional",i:"\u{1FAF6}",l:"EMOCIONAL",c:"#EC4899",g:"linear-gradient(135deg,#EC4899,#DB2777)"},
{k:"autotest",i:"\u{1F4DD}",l:"AUTOTEST",c:"#F59E0B",g:"linear-gradient(135deg,#F59E0B,#D97706)"},
{k:"cierre",i:"\u{1F51A}",l:"CIERRE",c:"#6366F1",g:"linear-gradient(135deg,#6366F1,#4F46E5)"}
];


function switchTab(i){CT=i;render();}
function tog(id){S["o_"+id]=!S["o_"+id];render();}

function secHeader(icon,title,sub,grad){
  return '<div class="sh" style="background:'+grad+'"><div class="big">'+icon+'</div><p style="font-size:14px;font-weight:700;opacity:.7;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Secci\u00f3n</p><h2>'+icon+' '+title+'</h2><p>'+sub+'</p></div>';
}

function actWrap(id,title,desc,level,color,content,defOpen){
  var open=S["o_"+id]!==undefined?S["o_"+id]:(defOpen||false);
  var h='<div class="card">';
  h+='<div class="cardh" onclick="tog(\''+id+'\')" style="border-left:4px solid '+color+';'+(open?'background:'+color+'08':'')+'">';
  h+='<div><h4>'+title+'</h4><small>'+desc+'</small></div>';
  h+='<div style="display:flex;align-items:center;gap:10px">';
  h+='<span class="badge" style="background:'+color+'18;color:'+color+'">'+level+'</span>';
  h+='<span class="arrow '+(open?'open':'')+'">&#9660;</span>';
  h+='</div></div>';
  if(open) h+='<div class="body">'+content+'</div>';
  h+='</div>';
  return h;
}

function fireConfetti(){
  var b=document.getElementById("confettiBox");
  b.innerHTML="";
  var colors=["#FF6B6B","#4ECDC4","#FFE66D","#A78BFA","#F472B6","#34D399"];
  for(var i=0;i<30;i++){
    var p=document.createElement("div");
    p.style.cssText="position:absolute;top:-20px;animation:confetti 1.2s ease-out forwards;opacity:0;left:"+Math.random()*100+"%;width:"+(4+Math.random()*6)+"px;height:"+(4+Math.random()*6)+"px;background:"+colors[Math.floor(Math.random()*colors.length)]+";border-radius:"+(Math.random()>.5?"50%":"1px")+";animation-delay:"+Math.random()*0.3+"s";
    b.appendChild(p);
  }
  setTimeout(function(){b.innerHTML=""},1500);
}

function render(){
  if(!D) return;
  var t=TABS[CT];
  var h='<div class="hdr">';
  h+='<a href="index.html" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:10px;border:1px solid #E5E7EB;background:#fff;color:#6B7280;font-size:13px;font-weight:600;text-decoration:none;margin-bottom:12px">\u2190 Volver</a><br>';
  h+='<span style="font-size:32px">\u{1F4D3}</span> ';
  h+='<h1 style="display:inline;background:linear-gradient(135deg,'+D.color_primario+','+D.color_secundario+')">'+D.materia+'</h1>';
  h+='<p style="font-size:14px;color:#6B7280;margin-top:4px">'+D.emoji+' Unidad '+D.unidad+': '+D.titulo+'</p>';
  h+='</div>';
  
  h+='<div class="tabs">';
  for(var i=0;i<TABS.length;i++){
    var tb=TABS[i];
    var isOn=i===CT;
    h+='<button class="tab '+(isOn?"on":"")+'" onclick="switchTab('+i+')" style="'+(isOn?'background:'+tb.g+';box-shadow:0 4px 15px '+tb.c+'40':'')+'">'+tb.i+' '+tb.l+'</button>';
  }
  h+='</div>';
  
  h+='<div class="cnt">'+renderSection()+'</div>';
  h+='<div class="foot">\u{1F4A1} <strong>Campus Cuaderno Vivo</strong> \u2014 '+D.materia+' \u00b7 Unidad '+D.unidad+'</div>';
  
  document.getElementById("app").innerHTML=h;
}

function renderSection(){
  switch(TABS[CT].k){
    case "umbral": return rUmbral();
    case "mapa": return rMapa();
    case "nucleo": return rNucleo();
    case "senales": return rSenales();
    case "sabias": return rSabias();
    case "cruces": return rCruces();
    case "relectura": return rRelectura();
    case "emocional": return rEmocional();
    case "autotest": return rAutotest();
    case "cierre": return rCierre();
    default: return "";
  }
}


function rUmbral(){
  return secHeader("\u{1F6AA}","UMBRAL","Conexi\u00f3n con la realidad \u2014 Activar conocimientos previos",TABS[0].g)
    +'<div class="sb">'
    +actWrap("u1","\u{1F525} Preguntas Disparadoras","Toc\u00e1 para revelar pistas","Activar","#F59E0B",rU1(),true)
    +actWrap("u2","\u{1F517} Conect\u00e1 con tu Vida","Eleg\u00ed una situaci\u00f3n","Conectar","#8B5CF6",rU2())
    +actWrap("u3","\u{1F321}\uFE0F Term\u00f3metro de Saberes","\u00bfCu\u00e1nto sab\u00e9s?","Diagnosticar","#EF4444",rU3())
    +'</div>';
}
function rU1(){
  var items=D.umbral.preguntas_disparadoras;
  var h="";
  for(var i=0;i<items.length;i++){
    var p=items[i], r=S["u1_"+i];
    h+='<div onclick="S[\'u1_'+i+'\']=!S[\'u1_'+i+'\'];render()" style="padding:16px 20px;border-radius:14px;cursor:pointer;margin-bottom:12px;background:'+(r?'linear-gradient(135deg,#FEF3C7,#FDE68A)':'#F9FAFB')+';border:'+(r?'2px solid #F59E0B':'2px dashed #D1D5DB')+'">';
    h+='<div style="display:flex;align-items:center;gap:12px"><span style="font-size:28px">'+p.emoji+'</span><div>';
    h+='<p style="font-size:15px;font-weight:600;color:#1F2937">'+p.texto+'</p>';
    if(r) h+='<p style="margin-top:8px;font-size:13px;color:#92400E;font-style:italic;animation:fadeIn .4s">\u{1F4A1} '+p.pista+'</p>';
    h+='</div></div>';
    if(!r) h+='<p style="margin:8px 0 0 40px;font-size:12px;color:#9CA3AF">Toc\u00e1 para descubrir la pista</p>';
    h+='</div>';
  }
  return h;
}
function rU2(){
  var sits=D.umbral.situaciones_conecta, sel=S.u2s;
  var h='<p style="margin:0 0 12px;font-size:14px;font-weight:600;color:#374151">\u00bfCu\u00e1l de estas situaciones viviste?</p>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';
  for(var i=0;i<sits.length;i++){
    var s=sits[i], on=sel===i;
    h+='<div onclick="S.u2s='+i+';render()" style="padding:14px;border-radius:12px;border:2px solid '+(on?'#8B5CF6':'#E5E7EB')+';background:'+(on?'#EDE9FE':'#fff')+';cursor:pointer;display:flex;align-items:center;gap:10px">';
    h+='<span style="font-size:24px">'+s.emoji+'</span><span style="font-size:13px;font-weight:500">'+s.label+'</span></div>';
  }
  h+='</div>';
  if(sel!==undefined){
    h+='<div style="animation:fadeIn .4s"><p style="font-size:13px;color:#6B7280;margin-bottom:8px">Contanos brevemente:</p>';
    h+='<textarea oninput="S.u2t=this.value" placeholder="Escrib\u00ed tu experiencia...">'+(S.u2t||'')+'</textarea></div>';
  }
  return h;
}
function rU3(){
  var v=S.u3v||50;
  var levels=[{m:20,t:"Nada \u{1F976}",c:"#3B82F6"},{m:40,t:"Poco \u{1F914}",c:"#06B6D4"},{m:60,t:"Algo \u{1F60A}",c:"#10B981"},{m:80,t:"Bastante \u{1F603}",c:"#F59E0B"},{m:101,t:"\u00a1Mucho! \u{1F525}",c:"#EF4444"}];
  var lv=levels[0]; for(var i=0;i<levels.length;i++){if(v<levels[i].m){lv=levels[i];break;}}
  var h='<div style="text-align:center;padding:10px">';
  h+='<p style="font-size:14px;font-weight:600;color:#374151;margin-bottom:16px">'+D.umbral.termometro_pregunta+'</p>';
  h+='<div style="height:10px;border-radius:10px;background:linear-gradient(90deg,#3B82F6,#06B6D4,#10B981,#F59E0B,#EF4444)"></div>';
  h+='<input type="range" min="0" max="100" value="'+v+'" oninput="S.u3v=+this.value;render()" style="width:100%;margin-top:-14px;position:relative;z-index:2;accent-color:'+lv.c+'">';
  h+='<div style="margin-top:12px;padding:10px 20px;border-radius:12px;background:'+lv.c+'15;display:inline-block">';
  h+='<span style="font-size:18px;font-weight:700;color:'+lv.c+'">'+lv.t+'</span></div></div>';
  return h;
}


function rMapa(){
  return secHeader("\u{1F5FA}\uFE0F","MAPA","Qu\u00e9 vamos a ver en la unidad",TABS[1].g)
    +'<div class="sb">'
    +actWrap("m1","\u{1F6E4}\uFE0F Ruta Visual","Recorr\u00e9 la unidad","Explorar","#0EA5E9",rM1(),true)
    +actWrap("m2","\u{1F3D4}\uFE0F Vista Panor\u00e1mica","Bloques tem\u00e1ticos","Anticipar","#10B981",rM2())
    +actWrap("m3","\u{1F9E0} Mapa Mental","Nodo central con ramas","Conectar","#8B5CF6",rM3())
    +'</div>';
}
function rM1(){
  if(!S.m1)S.m1={a:null,v:{}};
  var s=S.m1, ps=D.mapa.ruta_paradas;
  var visited=Object.keys(s.v).length;
  var prog=Math.round(visited/ps.length*100);
  var h='<div style="display:flex;justify-content:space-between;margin-bottom:16px"><span style="font-size:14px;font-weight:600;color:#374151">Tu recorrido:</span><span style="font-size:12px;color:#6B7280">'+prog+'%</span></div>';
  h+='<div class="bar" style="margin-bottom:16px"><div class="barfill" style="width:'+prog+'%;background:linear-gradient(90deg,#6366F1,#EC4899)"></div></div>';
  h+='<div style="position:relative;padding-left:24px">';
  h+='<div style="position:absolute;left:11px;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,#6366F1,#3B82F6,#10B981,#F59E0B,#EC4899);border-radius:3px"></div>';
  for(var i=0;i<ps.length;i++){
    var p=ps[i], active=s.a===p.id, done=s.v[p.id];
    h+='<div onclick="S.m1.a='+(active?'null':p.id)+';S.m1.v['+p.id+']=true;render()" style="position:relative;padding-left:28px;padding-bottom:'+(i<ps.length-1?20:0)+'px;cursor:pointer">';
    h+='<div style="position:absolute;left:-5px;top:4px;width:28px;height:28px;border-radius:50%;background:'+(done?p.color:'#fff')+';border:3px solid '+p.color+';display:flex;align-items:center;justify-content:center;font-size:'+(done?14:16)+'px;transform:'+(active?'scale(1.2)':'scale(1)')+'">'+(done?'\u2713':p.emoji)+'</div>';
    h+='<div style="padding:10px 14px;border-radius:12px;background:'+(active?p.color+'08':'#F9FAFB')+'">';
    h+='<span style="font-size:13px;font-weight:700;color:'+p.color+'">Parada '+(i+1)+'</span>';
    h+='<p style="margin:4px 0 0;font-size:15px;font-weight:600;color:#1F2937">'+p.title+'</p>';
    if(active) h+='<p style="margin:6px 0 0;font-size:13px;color:#6B7280;animation:fadeIn .3s">'+p.desc+'</p>';
    h+='</div></div>';
  }
  h+='</div>';
  return h;
}
function rM2(){
  var bs=D.mapa.panoramica_bloques;
  var h='';
  for(var i=0;i<bs.length;i++){
    var b=bs[i], open=S["m2_"+i];
    h+='<div onclick="S[\'m2_'+i+'\']=!S[\'m2_'+i+'\'];render()" style="border-radius:14px;overflow:hidden;border:2px solid '+(open?b.color:'#E5E7EB')+';cursor:pointer;margin-bottom:10px">';
    h+='<div style="padding:14px 18px;background:'+(open?'linear-gradient(135deg,'+b.color+','+b.color+'CC)':'#fff')+';display:flex;align-items:center;justify-content:space-between">';
    h+='<div style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">'+b.emoji+'</span><div>';
    h+='<p style="margin:0;font-size:15px;font-weight:700;color:'+(open?'#fff':'#1F2937')+'">'+b.title+'</p>';
    h+='<p style="margin:2px 0 0;font-size:12px;color:'+(open?'rgba(255,255,255,.8)':'#9CA3AF')+'">'+b.subtitle+'</p>';
    h+='</div></div>';
    h+='<span style="font-size:12px;font-weight:700;color:'+(open?'#fff':'#6B7280')+';background:'+(open?'rgba(255,255,255,.2)':'#F3F4F6')+';padding:4px 10px;border-radius:8px">'+b.items.length+' temas</span>';
    h+='</div>';
    if(open){
      h+='<div style="padding:12px 18px;background:#FAFAFA;animation:fadeIn .3s"><div style="display:flex;flex-wrap:wrap;gap:6px">';
      for(var j=0;j<b.items.length;j++){
        h+='<span style="padding:6px 14px;border-radius:10px;background:#fff;border:1px solid '+b.color+'30;font-size:13px;font-weight:500;color:#374151">\u2022 '+b.items[j]+'</span>';
      }
      h+='</div></div>';
    }
    h+='</div>';
  }
  return h;
}
function rM3(){
  var m=D.mapa.mapa_mental;
  var h='<div style="display:flex;justify-content:center;margin-bottom:16px">';
  h+='<div style="padding:16px 24px;border-radius:20px;background:linear-gradient(135deg,#6366F1,#8B5CF6);box-shadow:0 4px 20px rgba(99,102,241,.3)">';
  h+='<span style="font-size:24px">'+m.centro.emoji+'</span><span style="font-size:16px;font-weight:800;color:#fff;margin-left:8px">'+m.centro.title+'</span></div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  for(var i=0;i<m.ramas.length;i++){
    var r=m.ramas[i], open=S["m3_"+r.id];
    h+='<div onclick="S[\'m3_'+r.id+'\']=!S[\'m3_'+r.id+'\'];render()" style="padding:14px;border-radius:14px;border:2px solid '+(open?r.color:'#E5E7EB')+';background:'+(open?r.color+'08':'#fff')+';cursor:pointer">';
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:'+(open?8:0)+'px"><span style="font-size:20px">'+r.emoji+'</span><span style="font-size:13px;font-weight:700;color:'+r.color+'">'+r.title+'</span></div>';
    if(open){
      h+='<div style="animation:fadeIn .3s">';
      for(var j=0;j<r.items.length;j++){
        h+='<span style="display:block;font-size:12px;color:#374151;padding:4px 10px;border-radius:8px;background:#fff;border:1px solid '+r.color+'20;margin-bottom:4px">\u2022 '+r.items[j]+'</span>';
      }
      h+='</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  return h;
}


function rNucleo(){
  return secHeader("\u269B\uFE0F","N\u00daCLEO","10 actividades interactivas",TABS[2].g)
    +'<div class="sb">'

    +'</div>';
}
function rE1(){
  if(!S.e1) S.e1={sel:null,ref:""};
  var s=S.e1;
  var esc=[{e:"\u{1F60E}",l:"La tengo clara",c:"#10B981"},{e:"\u{1F642}",l:"Entiendo bastante",c:"#3B82F6"},{e:"\u{1F914}",l:"Necesito releer",c:"#F59E0B"},{e:"\u{1F62C}",l:"Me cuesta",c:"#F97316"},{e:"\u{1FAE3}",l:"No entiendo nada",c:"#EF4444"}];
  var h='<p style="font-size:14px;font-weight:600;color:#374151;margin:0 0 14px">\u00bfC\u00f3mo te sent\u00eds con lo que aprendiste?</p>';
  for(var i=0;i<esc.length;i++){
    var e=esc[i], sel=s.sel===i;
    h+='<div onclick="S.e1.sel='+i+';render()" style="padding:14px 18px;border-radius:14px;border:'+(sel?'3px solid '+e.c:'2px solid #E5E7EB')+';background:'+(sel?e.c+'15':'#fff')+';cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:8px">';
    h+='<span style="font-size:32px;transform:'+(sel?'scale(1.2)':'scale(1)')+'">'+e.e+'</span>';
    h+='<span style="font-size:15px;font-weight:700;color:'+(sel?e.c:'#1F2937')+'">'+e.l+'</span>';
    if(sel) h+='<span style="margin-left:auto;font-size:20px">\u2713</span>';
    h+='</div>';
  }
  if(s.sel!==null){
    var prompt=s.sel<=1?'\u{1F31F} \u00bfQu\u00e9 te ayud\u00f3 a entender?':s.sel===2?'\u{1F4A1} \u00bfQu\u00e9 parte releer\u00edas?':'\u{1F4AA} \u00bfQu\u00e9 te confunde m\u00e1s?';
    h+='<div style="animation:fadeIn .3s;margin-top:10px"><p style="font-size:13px;font-weight:600;color:#374151;margin:0 0 8px">'+prompt+'</p>';
    h+='<textarea oninput="S.e1.ref=this.value" placeholder="Tu reflexi\u00f3n...">'+s.ref+'</textarea></div>';
  }
  return h;
}
function rE2(){
  if(!S.e2) S.e2={a:"",d:"",dp:""};
  var s=S.e2;
  var ms=[{k:"a",l:"ANTES",e:"\u{1F6AA}",c:"#F59E0B",ph:"\u00bfQu\u00e9 pensaba antes?"},{k:"d",l:"DURANTE",e:"\u269B\uFE0F",c:"#6366F1",ph:"\u00bfQu\u00e9 me sorprendi\u00f3?"},{k:"dp",l:"DESPU\u00c9S",e:"\u2728",c:"#EC4899",ph:"\u00bfQu\u00e9 me llevo?"}];
  var h='';
  for(var i=0;i<ms.length;i++){
    var m=ms[i];
    h+='<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
    h+='<span style="font-size:18px">'+m.e+'</span><span style="font-size:13px;font-weight:700;color:'+m.c+'">'+m.l+'</span></div>';
    h+='<textarea oninput="S.e2.'+m.k+'=this.value" placeholder="'+m.ph+'" style="border-color:'+m.c+'30">'+(s[m.k]||"")+'</textarea></div>';
  }
  return h;
}


function rAutotest(){
  return secHeader("\u{1F4DD}","AUTOTEST","Test con nota autom\u00e1tica",TABS[8].g)
    +'<div class="sb">'
    +actWrap("at","\u{1F4DD} Test de la Unidad","6 preguntas","Evaluar","#F59E0B",rAT(),true)
    +'</div>';
}
function rAT(){
  var d=D.autotest.preguntas, tq=d.length;
  if(!S.at) S.at={cur:0,ans:{},fin:false};
  var s=S.at;
  var score=0; for(var k in s.ans){if(s.ans[k]===d[k].correcta)score++;}
  var pct=Math.round(score/tq*100);
  
  if(s.fin){
    var n=pct>=90?{e:"\u{1F3C6}",t:"\u00a1EXCELENTE!",c:"#10B981"}:pct>=70?{e:"\u{1F389}",t:"\u00a1Muy bien!",c:"#3B82F6"}:pct>=50?{e:"\u{1F44D}",t:"Aprobado",c:"#F59E0B"}:{e:"\u{1F4DA}",t:"Repasar",c:"#EF4444"};
    if(pct>=70) fireConfetti();
    var h='<div style="text-align:center;padding:20px">';
    h+='<div style="width:100px;height:100px;border-radius:50%;background:'+n.c+'15;border:4px solid '+n.c+';display:flex;align-items:center;justify-content:center;margin:0 auto 16px">';
    h+='<span style="font-size:32px;font-weight:900;color:'+n.c+'">'+Math.round(pct/10)+'</span></div>';
    h+='<span style="font-size:28px">'+n.e+'</span>';
    h+='<p style="margin:8px 0;font-size:20px;font-weight:800;color:'+n.c+'">'+n.t+'</p>';
    h+='<p style="margin:0;font-size:14px;color:#6B7280">'+score+'/'+tq+' correctas ('+pct+'%)</p>';
    h+='<button class="btn" onclick="S.at={cur:0,ans:{},fin:false};render()" style="margin-top:20px">Reintentar</button></div>';
    return h;
  }
  
  var p=d[s.cur], answered=s.ans[s.cur]!==undefined, ok=answered&&s.ans[s.cur]===p.correcta;
  var h='<div style="display:flex;justify-content:space-between;margin-bottom:12px">';
  h+='<span style="font-size:13px;font-weight:700;color:#6366F1">Pregunta '+(s.cur+1)+'/'+tq+'</span>';
  h+='<div style="display:flex;gap:4px">';
  for(var i=0;i<tq;i++){
    var a=s.ans[i], o=a!==undefined&&a===d[i].correcta, b=a!==undefined&&a!==d[i].correcta;
    h+='<div style="width:10px;height:10px;border-radius:50%;background:'+(i===s.cur?'#6366F1':o?'#10B981':b?'#EF4444':'#E5E7EB')+'"></div>';
  }
  h+='</div></div>';
  h+='<div style="padding:16px;border-radius:14px;background:#F5F3FF;margin-bottom:14px"><p style="margin:0;font-size:15px;font-weight:700;color:#374151">'+p.pregunta+'</p></div>';
  for(var j=0;j<p.opciones.length;j++){
    var opt=p.opciones[j], iSel=s.ans[s.cur]===j;
    var isCorrect=answered&&j===p.correcta;
    var isWrong=iSel&&!ok;
    h+='<div onclick="if(S.at.ans[S.at.cur]===undefined){S.at.ans[S.at.cur]='+j+';render()}" style="padding:12px 16px;border-radius:12px;border:'+(isCorrect?'2px solid #10B981':isWrong?'2px solid #EF4444':iSel?'2px solid #6366F1':'2px solid #E5E7EB')+';background:'+(isCorrect?'#ECFDF5':isWrong?'#FEF2F2':iSel?'#EEF2FF':'#fff')+';cursor:'+(answered?'default':'pointer')+';display:flex;align-items:center;gap:10px;margin-bottom:8px">';
    h+='<span style="width:28px;height:28px;border-radius:50%;border:2px solid '+(isCorrect?'#10B981':isWrong?'#EF4444':'#D1D5DB')+';background:'+(isCorrect?'#10B981':isWrong?'#EF4444':'transparent')+';color:'+(isCorrect||isWrong?'#fff':'#6B7280')+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">'+(isCorrect?'\u2713':isWrong?'\u2717':String.fromCharCode(65+j))+'</span>';
    h+='<span style="font-size:14px;font-weight:'+(iSel?600:400)+'">'+opt+'</span></div>';
  }
  if(answered){
    h+='<div class="fb" style="background:'+(ok?'#D1FAE5':'#FEF3C7')+'"><p style="margin:0;font-size:13px;color:'+(ok?'#065F46':'#92400E')+'">'+(ok?'\u2728 ':'\u{1F4D6} ')+p.explicacion+'</p></div>';
    h+='<button class="btn" onclick="if(S.at.cur<'+(tq-1)+'){S.at.cur++;render()}else{S.at.fin=true;render()}">'+(s.cur<tq-1?'Siguiente \u2192':'Ver mi nota')+'</button>';
  }
  return h;
}


function rCierre(){
  return secHeader("\u{1F51A}","CIERRE","Reflexi\u00f3n final, glosario y recursos",TABS[9].g)
    +'<div class="sb">'
    +actWrap("ci1","\u{1F4AD} Reflexi\u00f3n Final","\u00bfQu\u00e9 aprend\u00ed?","Reflexionar","#6366F1",rCI1(),true)
    +actWrap("ci2","\u{1F4D6} Glosario","T\u00e9rminos clave","Consultar","#10B981",rCI2())
    +actWrap("ci3","\u{1F517} Recursos","Para profundizar","Explorar","#8B5CF6",rCI3())
    +'</div>';
}
function rCI1(){
  if(!S.ci1) S.ci1={a:"",s:"",ap:""};
  var s=S.ci1;
  var prompts=[{k:"a",e:"\u{1F4A1}",l:"Lo m\u00e1s importante que aprend\u00ed",c:"#6366F1"},{k:"s",e:"\u{1F62E}",l:"Lo que m\u00e1s me sorprendi\u00f3",c:"#EC4899"},{k:"ap",e:"\u{1F30D}",l:"C\u00f3mo lo conecto con mi vida",c:"#10B981"}];
  var h='';
  for(var i=0;i<prompts.length;i++){
    var p=prompts[i];
    h+='<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
    h+='<span style="font-size:18px">'+p.e+'</span><span style="font-size:13px;font-weight:700;color:'+p.c+'">'+p.l+'</span></div>';
    h+='<textarea oninput="S.ci1.'+p.k+'=this.value" placeholder="..." style="border-color:'+p.c+'30;min-height:60px">'+(s[p.k]||"")+'</textarea></div>';
  }
  return h;
}
function rCI2(){
  if(!S.ci2) S.ci2={q:"",ex:null};
  var s=S.ci2, terms=D.cierre.glosario;
  var filtered=terms.filter(function(t){
    if(!s.q) return true;
    return t.termino.toLowerCase().indexOf(s.q.toLowerCase())>=0 || t.definicion.toLowerCase().indexOf(s.q.toLowerCase())>=0;
  });
  var h='<div style="margin-bottom:14px"><input type="text" value="'+s.q+'" oninput="S.ci2.q=this.value;S.ci2.ex=null;render()" placeholder="\u{1F50D} Buscar..." style="padding:12px 16px"></div>';
  for(var i=0;i<filtered.length;i++){
    var t=filtered[i], isOpen=s.ex===i;
    h+='<div onclick="S.ci2.ex='+(isOpen?'null':i)+';render()" style="padding:10px 14px;border-radius:12px;border:'+(isOpen?'2px solid #6366F1':'1px solid #E5E7EB')+';background:'+(isOpen?'#F5F3FF':'#fff')+';cursor:pointer;margin-bottom:6px">';
    h+='<div style="display:flex;align-items:center;justify-content:space-between">';
    h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">'+t.emoji+'</span><span style="font-size:14px;font-weight:700">'+t.termino+'</span></div>';
    h+='<span style="font-size:10px;color:#9CA3AF;background:#F3F4F6;padding:2px 8px;border-radius:6px">'+t.categoria+'</span></div>';
    if(isOpen) h+='<p style="margin:8px 0 0;font-size:13px;color:#374151;line-height:1.5;animation:fadeIn .3s">'+t.definicion+'</p>';
    h+='</div>';
  }
  h+='<p style="text-align:center;margin-top:10px;font-size:12px;color:#9CA3AF">'+filtered.length+'/'+terms.length+'</p>';
  return h;
}
function rCI3(){
  var rs=D.cierre.recursos, h='';
  for(var i=0;i<rs.length;i++){
    var r=rs[i], star=S["ci3_"+i];
    h+='<div style="padding:12px 16px;border-radius:12px;border:'+(star?'2px solid '+r.color:'1px solid #E5E7EB')+';margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">';
    h+='<div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">';
    h+='<span style="font-size:12px;font-weight:700;color:'+r.color+'">'+r.tipo+'</span>';
    h+='<span style="font-size:10px;color:#9CA3AF;background:#F3F4F6;padding:2px 6px;border-radius:4px">'+r.nivel+'</span></div>';
    h+='<p style="margin:0;font-size:14px;font-weight:600">'+r.title+'</p>';
    h+='<p style="margin:4px 0 0;font-size:12px;color:#6B7280">'+r.desc+'</p></div>';
    h+='<button onclick="S[\'ci3_'+i+'\']=!S[\'ci3_'+i+'\'];render()" style="background:none;border:none;font-size:22px;cursor:pointer;margin-left:10px">'+(star?'\u2B50':'\u2606')+'</button></div>';
  }
  return h;
}
