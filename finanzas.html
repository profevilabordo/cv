document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ze:12.5px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);margin-bottom:26px;font-weight:500}\n.lead{font-size:17px;line-height:1.62;color:var(--soft);max-width:62ch}\n.cover-meta{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);font-family:'Spline Sans Mono',monospace}\n\n/* ROADMAP */\n.h-block{font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:40px 0 4px}\n.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0 8px}\n.road{border-radius:16px;padding:24px;border:1px solid var(--line);background:#fff}\n.road.b1{border-color:var(--c1soft)} .road.b2{border-color:var(--c2soft)}\n.road .rt{font-family:'Spline Sans Mono',monospace;font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--c);font-weight:600}\n.road h3{font-size:23px;font-weight:700;margin:8px 0 9px}\n.road p{font-size:14px;color:var(--soft);margin:0}\n.road .cnt{display:inline-block;margin-top:14px;font-size:12.5px;font-weight:700;color:#fff;background:var(--c);padding:4px 11px;border-radius:999px}\n\n/* DIVIDER */\n.divider{border-radius:22px;padding:46px 42px;margin:0;color:#fff;break-before:page}\n.divider.b1{background:var(--c1)} .divider.b2{background:var(--c2)}\n.divider-num{font-family:'Spline Sans Mono',monospace;font-size:12.5px;letter-spacing:0.14em;text-transform:uppercase;opacity:.82;font-weight:500}\n.divider-title{font-size:42px;font-weight:800;margin:12px 0 14px;line-height:1.02}\n.divider-sub{font-size:16.5px;opacity:.94;max-width:58ch;line-height:1.55}\n.divider .strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}\n.divider .strip span{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:999px}\n\n/* TEMA */\n.tema{break-before:page;padding-top:8px}\n.kicker{font-family:'Spline Sans Mono',monospace;font-size:11.5px;letter-spacing:0.13em;text-transform:uppercase;font-weight:600;color:var(--c);margin-bottom:11px}\n.tema-title{font-size:29px;font-weight:700;margin-bottom:7px}\n.tema-sub{font-size:16.5px;color:var(--c);font-weight:500;font-style:italic;margin:0 0 22px}\n.tema > p, .body > p{font-size:15.5px;color:var(--ink)}\n\n/* CARDS */\n.cards{display:grid;gap:14px;margin:18px 0 6px}\n.cards.c2{grid-template-columns:1fr 1fr}\n.cards.c3{grid-template-columns:repeat(3,1fr)}\n.cards.c4{grid-template-columns:repeat(4,1fr)}\n.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}\n.card .tag{display:block;font-family:'Spline Sans Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--c);margin-bottom:7px}\n.card h4{font-size:16.5px;font-weight:700;margin-bottom:6px}\n.card p{font-size:13.8px;line-height:1.55;margin:0;color:var(--soft)}\n.card .num{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--csoft);color:var(--cd);font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;margin-bottom:11px}\n.card ul{margin:8px 0 0;padding-left:17px;font-size:13.6px;line-height:1.5;color:var(--soft)}\n.card li{margin-bottom:6px}\n.card li b{font-weight:600;color:var(--ink)}\n\n/* CALLOUT */\n.callout{border-radius:14px;padding:16px 18px;margin:20px 0;font-size:14.5px;line-height:1.55;background:var(--ctint);border:1px solid var(--csoft)}\n.callout .lbl{display:block;font-family:'Spline Sans Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--c);margin-bottom:6px}\n.callout p{margin:0}\n\n/* QUOTE */\n.quote{margin:26px 0;padding:2px 0 2px 22px;border-left:3px solid var(--c);font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:600;line-height:1.32;color:#37322b}\n.quote cite{display:block;margin-top:11px;font-family:'Figtree',sans-serif;font-size:13.5px;font-weight:500;font-style:normal;color:var(--muted)}\n\n/* TABLE */\ntable.data{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px}\ntable.data th{background:var(--csoft);color:var(--cd);text-align:right;padding:10px 13px;font-weight:600;border-bottom:2px solid #fff}\ntable.data th:first-child{text-align:left;border-radius:9px 0 0 0}\ntable.data th:last-child{border-radius:0 9px 0 0}\ntable.data td{padding:9px 13px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-family:'Spline Sans Mono',monospace;font-size:13.5px}\ntable.data td:first-child{text-align:left;font-family:'Figtree',sans-serif;font-weight:500;font-size:14px}\ntable.data tr:last-child td{border-bottom:none}\ntable.data tr:last-child td:first-child{font-weight:700}\n\n/* FORMULA */\n.formula{background:var(--ctint);border:1px solid var(--csoft);border-radius:12px;padding:17px 22px;margin:16px 0;text-align:center;font-family:'Spline Sans Mono',monospace;font-size:18px;color:var(--cd);font-weight:500}\n.formula sup{font-size:.68em;vertical-align:super}\n.formula sub{font-size:.68em}\n.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .35em}\n.frac .num{padding:0 .5em 2px}\n.frac .den{padding:2px .5em 0;border-top:1.6px solid currentColor}\n.fnote{text-align:center;font-size:13px;color:var(--muted);margin:-4px 0 6px}\n\n/* WIDGET */\n.widget{background:#fff;border:1.5px solid var(--csoft);border-radius:18px;padding:22px 22px 24px;margin:24px 0}\n.widget-head{display:flex;align-items:center;gap:11px;margin-bottom:3px;flex-wrap:wrap}\n.widget-tag{font-family:'Spline Sans Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#fff;background:var(--c);padding:5px 10px;border-radius:999px}\n.widget h4{font-size:18px;font-weight:700}\n.widget-note{font-size:13px;color:var(--muted);margin:3px 0 18px}\n.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;margin-bottom:6px}\n.slider-row{display:flex;flex-direction:column;gap:7px}\n.slider-row label{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;font-weight:600}\n.slider-row label b{font-family:'Spline Sans Mono',monospace;color:var(--cd);font-weight:600;font-size:15px}\ninput[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:var(--csoft);outline:none;margin:0}\ninput[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--c);cursor:pointer;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.22)}\ninput[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--c);cursor:pointer;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.22)}\n.results{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:20px 0 0}\n.result{background:var(--ctint);border-radius:12px;padding:13px 15px}\n.result .rl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;font-family:'Spline Sans Mono',monospace}\n.result .rv{font-family:'Spline Sans Mono',monospace;font-size:19px;font-weight:600;color:var(--cd);font-variant-numeric:tabular-nums;margin-top:3px}\n.result.hi{background:var(--c)} .result.hi .rl{color:rgba(255,255,255,.8)} .result.hi .rv{color:#fff}\n\n/* CHART */\n.chart{margin-top:22px}\n.chart-bars{display:flex;align-items:flex-end;gap:3px;height:188px;padding-top:8px}\n.bar-group{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;min-width:0}\n.bar{flex:1;max-width:18px;border-radius:4px 4px 0 0;min-height:2px}\n.bar.s{background:var(--csoft)}\n.bar.c{background:var(--c)}\n.chart-axis{display:flex;gap:3px;margin-top:6px;border-top:1.5px solid var(--line);padding-top:6px}\n.chart-axis span{flex:1;text-align:center;font-size:9.5px;color:var(--muted);font-family:'Spline Sans Mono',monospace}\n.legend{display:flex;gap:20px;margin-top:14px;font-size:13px;color:var(--soft)}\n.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:7px;vertical-align:-2px}\n\n/* BUCKETS (50/30/20) */\n.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}\n.bucket{border-radius:14px;padding:17px;color:#fff}\n.bucket.nec{background:var(--c1d)} .bucket.des{background:var(--c1)} .bucket.aho{background:#5bbd8a}\n.bucket .bn{font-size:13px;opacity:.92;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;font-family:'Spline Sans Mono',monospace}\n.bucket .bp{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;margin-top:2px}\n.bucket .bv{font-family:'Spline Sans Mono',monospace;font-size:18px;margin-top:4px;font-weight:500}\n.bucket small{display:block;font-size:11.5px;opacity:.88;margin-top:8px;line-height:1.45}\n\n/* TASA REAL OUT */\n.tr-out{text-align:center;padding:22px;border-radius:14px;margin-top:20px}\n.tr-out.pos{background:var(--c1tint);border:1px solid var(--c1soft)}\n.tr-out.neg{background:#fcebe6;border:1px solid #f6d3c8}\n.tr-big{font-family:'Bricolage Grotesque',sans-serif;font-size:44px;font-weight:800;line-height:1}\n.tr-out.pos .tr-big{color:var(--c1d)} .tr-out.neg .tr-big{color:#c0492c}\n.tr-msg{font-size:14px;margin-top:10px;max-width:46ch;margin-left:auto;margin-right:auto;color:var(--soft)}\n\n/* FLOW (resumen) */\n.flow{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:22px 0}\n.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600}\n.chip.g{border-color:var(--c1soft);color:var(--c1d)} .chip.b{border-color:var(--c2soft);color:var(--c2d)}\n.flow .arr{color:var(--muted);font-weight:700}\n\n/* SIGNOFF */\n.signoff{margin-top:34px;padding-top:22px;border-top:2px solid var(--line)}\n.signoff b{font-weight:700;font-size:16px}\n.signoff .role{color:var(--muted);font-size:13.5px;font-family:'Spline Sans Mono',monospace;margin-top:3px}\n\n@page{size:letter;margin:0}\n@media print{\n  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  html,body{margin:0;padding:0}\n  .doc{max-width:none!important;margin:0!important;padding:0 .7in!important;box-shadow:none!important;border:none!important}\n  #dc-root,.sc-host{height:auto!important}\n  .hdr-space,.ftr-space{display:table-cell;height:.7in!important}\n  .running-hdr,.running-ftr{display:flex!important;justify-content:space-between;align-items:baseline;position:fixed!important;left:0;right:0;margin:0!important;font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);font-family:'Spline Sans Mono',monospace}\n  .running-hdr{top:0;padding:.34in .7in 0!important}\n  .running-ftr{bottom:0;padding:0 .7in .34in!important}\n  h1,h2,h3,h4{break-after:avoid}\n  table,.card,.callout,.widget,.divider,.formula,.road,.bucket,.tr-out,.quote,.bar-group{break-inside:avoid}\n  p,li{orphans:3;widows:3}\n  .screen-only{display:none!important}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<main class=\"doc\">\n<table class=\"doc-frame\" role=\"presentation\">\n<thead><tr><td class=\"hdr-space\"><\u002Ftd><\u002Ftr><\u002Fthead>\n<tbody><tr><td>\n\n<div class=\"running-hdr\"><span>Organización y Gestión Comercial · Unidad 2<\u002Fspan><span>EETP N°602<\u002Fspan><\u002Fdiv>\n<div class=\"running-ftr\"><span>Finanzas Personales &amp; Matemática Financiera<\u002Fspan><span>Prof. Verónica Vila Bordó<\u002Fspan><\u002Fdiv>\n\n<header class=\"cover\" data-screen-label=\"Portada\">\n  <h1 class=\"cover-title\">Finanzas Personales &amp; Nociones de Matemática Financiera<\u002Fh1>\n  <p class=\"cover-kicker\">Unidad N°2 · Organización y Gestión Comercial · 6.º \"A\" Técnicos en Informática<\u002Fp>\n  <p class=\"lead\">En esta unidad vamos a recorrer juntos dos grandes bloques de contenido que van a cambiar la forma en la que ven el dinero y las decisiones económicas del día a día. Primero exploramos las <strong>finanzas personales<\u002Fstrong>: cómo administrar lo que tenemos, planificar gastos, ahorrar con inteligencia y endeudarnos de manera responsable. Después nos metemos de lleno en las <strong>nociones de matemática financiera<\u002Fstrong>, donde los números cobran sentido real al aplicarlos a plazos fijos, préstamos, tarjetas de crédito y al fenómeno de la inflación en la Argentina.<\u002Fp>\n  <div class=\"cover-meta\">\n    <span>Prof. Verónica Vila Bordó<\u002Fspan>\n    <span>EETP N°602 \"Gral. José de San Martín\"<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<p class=\"h-block\">Hoja de ruta de la unidad<\u002Fp>\n<p style=\"font-size:15px;color:var(--soft);max-width:64ch\">Para que tengan una visión clara de todo lo que vamos a recorrer, acá están los dos bloques con sus temas organizados paso a paso. Cada tema se construye sobre el anterior, así que es importante no saltear ninguno.<\u002Fp>\n<div class=\"roadmap\">\n  <div class=\"road b1\">\n    <div class=\"rt\">Bloque 1<\u002Fdiv>\n    <h3>Finanzas Personales<\u002Fh3>\n    <p>7 temas que van desde entender qué son las finanzas personales hasta fijar metas financieras a corto, mediano y largo plazo.<\u002Fp>\n    <span class=\"cnt\">7 temas<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"road b2\">\n    <div class=\"rt\">Bloque 2<\u002Fdiv>\n    <h3>Matemática Financiera<\u002Fh3>\n    <p>8 temas que arrancan con el valor del dinero en el tiempo y terminan analizando la inflación y las tasas reales en contexto argentino.<\u002Fp>\n    <span class=\"cnt\">8 temas<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size:14px;color:var(--muted);margin-top:14px\">Cada tema incluye explicaciones claras, ejemplos cercanos a la realidad de un estudiante de 6.º año y actividades prácticas para aplicar lo aprendido.<\u002Fp>\n\n<!-- ===================== BLOQUE 1 ===================== -->\n<div class=\"divider b1\" data-screen-label=\"Bloque 1\">\n  <div class=\"divider-num\">Bloque 1<\u002Fdiv>\n  <div class=\"divider-title\">Finanzas Personales<\u002Fdiv>\n  <div class=\"divider-sub\">Administrar lo que tenés para lograr lo que querés. Siete temas para tomar el control de tu economía personal, sin importar cuánto ganes hoy.<\u002Fdiv>\n  <div class=\"strip\"><span>Ingresos y gastos<\u002Fspan><span>Presupuesto<\u002Fspan><span>Ahorro<\u002Fspan><span>Deudas<\u002Fspan><span>Metas<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<section class=\"tema b1\" data-screen-label=\"B1·T1 Qué son\">\n  <div class=\"kicker\">Bloque 1 · Tema 1<\u002Fdiv>\n  <h2 class=\"tema-title\">¿Qué son las finanzas personales?<\u002Fh2>\n  <p class=\"tema-sub\">Administrar lo que tenés para lograr lo que querés<\u002Fp>\n  <p>Cuando hablamos de finanzas personales, nos referimos al conjunto de decisiones y acciones que cada persona toma respecto de su dinero a lo largo de la vida. No es algo exclusivo de empresarios o contadores: cada vez que decidís comprarte unas zapatillas, cargar la SUBE o ahorrar para el viaje de egresados, estás haciendo finanzas personales. La diferencia está en si lo hacés de manera consciente y planificada, o si simplemente \"dejás que las cosas pasen\".<\u002Fp>\n  <p>Las finanzas personales abarcan cuatro grandes pilares que vamos a desarrollar en este bloque:<\u002Fp>\n  <div class=\"cards c4\">\n    <div class=\"card\"><span class=\"tag\">Ganar<\u002Fspan><p>Comprender de dónde provienen tus ingresos y cómo podrías aumentarlos.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Gastar<\u002Fspan><p>Decidir en qué, cuánto y cuándo usar tu dinero de forma inteligente.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Ahorrar<\u002Fspan><p>Reservar una parte de tus ingresos antes de gastar, como hábito.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Proteger<\u002Fspan><p>Cuidar lo que tenés, evitar deudas tóxicas y planificar ante imprevistos.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p>La clave de las finanzas personales es la <strong>toma de decisiones informadas<\u002Fstrong>. No se trata de privarse de todo, sino de entender las consecuencias de cada elección económica. Un adolescente que empieza a manejar su dinero con criterio hoy tiene muchas más probabilidades de alcanzar estabilidad y bienestar financiero en el futuro. Pensalo así: si aprendés a programar en la escuela técnica, ¿por qué no aprender también a \"programar\" tu economía personal?<\u002Fp>\n  <blockquote class=\"quote\">\"Las finanzas personales son un 80% comportamiento y un 20% conocimiento técnico.\"<cite>— Dave Ramsey<\u002Fcite><\u002Fblockquote>\n  <p>A lo largo de este bloque vamos a construir herramientas prácticas para que cada uno pueda tomar el control de su situación económica, sin importar cuánto gane o cuánto tenga hoy. Lo importante es empezar.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"tema b1\" data-screen-label=\"B1·T2 Ingresos y gastos\">\n  <div class=\"kicker\">Bloque 1 · Tema 2<\u002Fdiv>\n  <h2 class=\"tema-title\">Ingresos y Gastos<\u002Fh2>\n  <p class=\"tema-sub\">De dónde viene y a dónde va el dinero<\u002Fp>\n  <p>Todo el sistema de finanzas personales se sostiene sobre dos conceptos fundamentales: los <strong>ingresos<\u002Fstrong> (el dinero que entra) y los <strong>gastos<\u002Fstrong> (el dinero que sale). Parece simple, pero la mayoría de las personas —incluso adultos con años de experiencia laboral— no tienen del todo claro cuánto ganan realmente ni en qué gastan cada mes.<\u002Fp>\n  <div class=\"cards c2\">\n    <div class=\"card\">\n      <h4>💰 Tipos de ingresos<\u002Fh4>\n      <ul>\n        <li><b>Activos:<\u002Fb> los que obtenés trabajando (sueldo, changas, freelance).<\u002Fli>\n        <li><b>Pasivos:<\u002Fb> los que generan dinero sin trabajo constante (alquileres, inversiones, regalías).<\u002Fli>\n        <li><b>Extraordinarios:<\u002Fb> plata que llega de forma esporádica (un regalo, una venta puntual, un premio).<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h4>🛒 Tipos de gastos<\u002Fh4>\n      <ul>\n        <li><b>Fijos:<\u002Fb> se repiten todos los meses con un valor similar (alquiler, cuota del celular, transporte).<\u002Fli>\n        <li><b>Variables:<\u002Fb> cambian según el mes (salidas, ropa, entretenimiento).<\u002Fli>\n        <li><b>Hormiga:<\u002Fb> pequeños gastos que pasan desapercibidos pero, acumulados, suman mucho (snacks, apps, cafecitos).<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p>Una herramienta muy útil es el <strong>registro de gastos<\u002Fstrong>: durante una semana o un mes, anotar absolutamente todo lo que se gasta. Puede ser en un cuaderno, una planilla de cálculo o una app del celular. El objetivo no es juzgarse, sino tener información real para tomar mejores decisiones.<\u002Fp>\n  <div class=\"callout\">\n    <span class=\"lbl\">Actividad sugerida<\u002Fspan>\n    <p>Durante una semana, registrá todos tus gastos en una planilla. Después clasificalos en fijos, variables y hormiga. ¿Te sorprendió algo?<\u002Fp>\n  <\u002Fdiv>\n  <p>Cuando los gastos superan a los ingresos estamos en <strong>déficit<\u002Fstrong> (gastamos más de lo que ganamos). Cuando los ingresos superan a los gastos tenemos un <strong>superávit<\u002Fstrong>, y eso nos permite ahorrar o invertir. El primer paso para tener finanzas sanas es siempre el mismo: saber exactamente cuánto entra y cuánto sale.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"tema b1\" data-screen-label=\"B1·T3 Presupuesto\">\n  <div class=\"kicker\">Bloque 1 · Tema 3<\u002Fdiv>\n  <h2 class=\"tema-title\">El Presupuesto Personal<\u002Fh2>\n  <p class=\"tema-sub\">Planificar para no quedar en rojo<\u002Fp>\n  <p>El presupuesto personal es la herramienta más poderosa de las finanzas personales. Es, básicamente, un plan que detalla cuánto esperás ganar y cuánto pensás gastar en un período determinado (generalmente un mes). No es una restricción: es un mapa que te ayuda a llegar adonde querés sin perderte en el camino.<\u002Fp>\n  <p>Armar un presupuesto tiene tres pasos fundamentales:<\u002Fp>\n  <div class=\"cards c3\">\n    <div class=\"card\"><div class=\"num\">1<\u002Fdiv><h4>Estimar los ingresos<\u002Fh4><p>Calculá cuánto dinero vas a recibir este mes. Si tus ingresos son irregulares, usá un promedio de los últimos tres meses como referencia.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">2<\u002Fdiv><h4>Listar los gastos<\u002Fh4><p>Anotá todos los gastos que esperás tener: fijos primero (porque son obligatorios), luego variables. No te olvides de los gastos hormiga.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">3<\u002Fdiv><h4>Hacer la cuenta<\u002Fh4><p>Restá los gastos a los ingresos. Si es positivo, ¡genial! Si es negativo, ajustá recortando gastos o buscando más ingresos.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p>Un método muy popular es la <strong>regla 50/30/20<\u002Fstrong>, que propone distribuir los ingresos en necesidades, deseos y ahorro. Movés el control de abajo y mirás cómo se reparte tu sueldo:<\u002Fp>\n\n  <div class=\"widget b1\">\n    <div class=\"widget-head\"><span class=\"widget-tag\">Probalo<\u002Fspan><h4>Calculadora 50 / 30 / 20<\u002Fh4><\u002Fdiv>\n    <p class=\"widget-note screen-only\">Arrastrá el control para ver cómo se reparte un ingreso mensual según la regla.<\u002Fp>\n    <div class=\"slider-row\">\n      <label>Ingreso mensual <b>{{ ingreso }}<\u002Fb><\u002Flabel>\n      <input type=\"range\" min=\"50000\" max=\"800000\" step=\"10000\" value=\"{{ ingresoVal }}\" oninput=\"{{ onIngreso }}\">\n    <\u002Fdiv>\n    <div class=\"buckets\">\n      <div class=\"bucket nec\"><div class=\"bn\">50% Necesidades<\u002Fdiv><div class=\"bp\">{{ nec }}<\u002Fdiv><small>Vivienda, transporte, alimentación y servicios esenciales.<\u002Fsmall><\u002Fdiv>\n      <div class=\"bucket des\"><div class=\"bn\">30% Deseos<\u002Fdiv><div class=\"bp\">{{ des }}<\u002Fdiv><small>Entretenimiento, salidas, ropa no urgente, suscripciones.<\u002Fsmall><\u002Fdiv>\n      <div class=\"bucket aho\"><div class=\"bn\">20% Ahorro<\u002Fdiv><div class=\"bp\">{{ aho }}<\u002Fdiv><small>Dinero reservado para metas futuras o imprevistos.<\u002Fsmall><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p>En Argentina, con la inflación, el presupuesto se vuelve aún más importante porque los precios cambian rápidamente. Revisarlo y ajustarlo cada mes no es opcional: es necesario. Lo importante es que el presupuesto sea <strong>realista, no ideal<\u002Fstrong>. De nada sirve un plan perfecto que nadie puede cumplir.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"tema b1\" data-screen-label=\"B1·T4 Necesidades vs deseos\">\n  <div class=\"kicker\">Bloque 1 · Tema 4<\u002Fdiv>\n  <h2 class=\"tema-title\">Necesidades vs. Deseos<\u002Fh2>\n  <p class=\"tema-sub\">Aprender a distinguir y priorizar<\u002Fp>\n  <p>Acá viene uno de los conceptos más difíciles de aceptar en finanzas personales: no todo lo que queremos es algo que necesitamos. Y al revés, a veces subestimamos cosas que sí necesitamos. Poder distinguir entre necesidades y deseos es fundamental para tomar buenas decisiones con el dinero.<\u002Fp>\n  <div class=\"cards c2\">\n    <div class=\"card\"><span class=\"tag\">Necesidades<\u002Fspan><p>Cosas imprescindibles para vivir con dignidad: alimentación, vivienda, salud, educación, transporte básico, vestimenta adecuada. Si no las cubrimos, nuestra calidad de vida se deteriora seriamente.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Deseos<\u002Fspan><p>Cosas que nos gustaría tener pero que podemos postergar sin que nuestra vida corra riesgo: la última consola, zapatillas de marca, salidas frecuentes, streaming premium.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p>La línea entre necesidad y deseo no siempre es clara. Un celular puede ser una necesidad (para comunicarte y trabajar), pero el último modelo con 256 GB es probablemente un deseo. Tener ropa es una necesidad, pero comprar una campera de marca cara es un deseo. La clave está en hacerse una pregunta simple antes de cada compra: <strong>¿Realmente lo necesito o simplemente lo quiero?<\u002Fstrong><\u002Fp>\n  <p>Esto no significa que nunca haya que darse gustos. La vida sin deseos sería muy aburrida. La idea es que los deseos se satisfagan <strong>después<\u002Fstrong> de cubrir las necesidades y el ahorro, no antes. Es una cuestión de prioridades.<\u002Fp>\n  <div class=\"callout\">\n    <span class=\"lbl\">Para reflexionar<\u002Fspan>\n    <p>Pensá en tu última compra importante. ¿Fue una necesidad o un deseo? ¿La volverías a comprar hoy con la misma convicción?<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"tema b1\" data-screen-label=\"B1·T5 Ahorro\">\n  <div class=\"kicker\">Bloque 1 · Tema 5<\u002Fdiv>\n  <h2 class=\"tema-title\">El Ahorro como Hábito<\u002Fh2>\n  <p class=\"tema-sub\">Por qué guardar una parte antes de gastar<\u002Fp>\n  <p>Hay una frase que resume todo este tema: <strong>\"Pagáte a vos primero\"<\u002Fstrong>. ¿Qué significa? Que cuando recibís dinero, lo primero que tenés que hacer es separar una parte para ahorro, y recién después distribuir el resto en gastos. Si esperás a \"ver si sobra algo a fin de mes\", la respuesta casi siempre va a ser que no sobró nada.<\u002Fp>\n  <p>El ahorro no depende de cuánto ganés, sino de la <strong>disciplina y la constancia<\u002Fstrong>. Hay personas con ingresos altos que no ahorran ni un peso, y otras con ingresos modestos que logran juntar para sus metas. La diferencia está en el hábito.<\u002Fp>\n  <div class=\"cards c2\">\n    <div class=\"card\"><div class=\"num\">1<\u002Fdiv><h4>Definí un porcentaje<\u002Fh4><p>Empezá con algo alcanzable: un 10% de lo que recibís. Si podés más, mejor; pero lo importante es ser constante.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">2<\u002Fdiv><h4>Separálo apenas cobrés<\u002Fh4><p>No esperes a fin de mes. Apenas entra el dinero, apartá tu porcentaje de ahorro. Si es posible, automatizalo.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">3<\u002Fdiv><h4>No lo toques<\u002Fh4><p>El dinero ahorrado tiene un destino específico: tus metas. Si lo gastás ante la primera tentación, no funciona como ahorro.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">4<\u002Fdiv><h4>Hacelo crecer<\u002Fh4><p>El dinero debajo del colchón pierde valor (sobre todo en Argentina). Buscá opciones para que al menos compense la inflación.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p>Ahorrar tiene múltiples beneficios: te da tranquilidad ante imprevistos, te permite alcanzar metas que de otra forma serían imposibles y, sobre todo, te da <strong>libertad<\u002Fstrong>. Quien tiene ahorros puede elegir con más calma, sin la presión de llegar justo o tener que endeudarse ante cualquier imprevisto.<\u002Fp>\n  <blockquote class=\"quote\">\"El ahorro no es lo que te sobra después de gastar; el gasto es lo que te sobra después de ahorrar.\"<\u002Fblockquote>\n<\u002Fsection>\n\n<section class=\"tema b1\" data-screen-label=\"B1·T6 Deudas\">\n  <div class=\"kicker\">Bloque 1 · Tema 6<\u002Fdiv>\n  <h2 class=\"tema-title\">Las Deudas: ¿Amigas o Enemigas?<\u002Fh2>\n  <p class=\"tema-sub\">Crédito responsable e irresponsable<\u002Fp>\n  <p>Las deudas tienen mala fama, pero la realidad es más compleja. No todas las deudas son malas. Lo que importa es <strong>por qué<\u002Fstrong> te endeudás, <strong>a qué tasa<\u002Fstrong> y si <strong>podés pagarla<\u002Fstrong>. Un préstamo para estudiar o iniciar un emprendimiento puede ser una inversión inteligente; financiar unas vacaciones con la tarjeta en 12 cuotas con intereses altísimos, probablemente no tanto.<\u002Fp>\n  <div class=\"cards c2\">\n    <div class=\"card\"><span class=\"tag\">Deuda \"buena\"<\u002Fspan><p>Se toma para adquirir algo que genera valor a futuro: educación, herramientas de trabajo, una vivienda. Tiene una tasa razonable y un plan de pago que podés cumplir sin asfixiarte.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Deuda \"mala\"<\u002Fspan><p>Se contrae para financiar consumo que pierde valor rápido (ropa, electrónica, salidas) a tasas altísimas. Cuando los intereses se acumulan, se vuelve una trampa difícil de salir.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p>En Argentina, las tarjetas de crédito son uno de los instrumentos de deuda más comunes —y más peligrosos si no se usan con criterio—. El <strong>pago mínimo<\u002Fstrong> parece una salida cómoda, pero en realidad extiende la deuda y multiplica los intereses. Para dimensionarlo: si pagás siempre el mínimo de una tarjeta, lo que compraste puede terminar costándote el doble o el triple.<\u002Fp>\n  <div class=\"callout\">\n    <span class=\"lbl\">Regla de oro<\u002Fspan>\n    <p>Antes de endeudarte, preguntáte: ¿puedo pagar las cuotas sin dejar de cubrir mis necesidades básicas ni mi ahorro? Si la respuesta es no, esperá.<\u002Fp>\n  <\u002Fdiv>\n  <p>El endeudamiento responsable implica tres cosas: conocer la tasa de interés, tener un plan de pago realista y no comprometer más del <strong>30% de tus ingresos<\u002Fstrong> en cuotas. Si cumplís esas tres condiciones, el crédito puede ser un aliado.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"tema b1\" data-screen-label=\"B1·T7 Metas\">\n  <div class=\"kicker\">Bloque 1 · Tema 7<\u002Fdiv>\n  <h2 class=\"tema-title\">Metas Financieras<\u002Fh2>\n  <p class=\"tema-sub\">Corto, mediano y largo plazo<\u002Fp>\n  <p>Ahorrar sin un objetivo concreto es difícil de sostener. Las metas financieras le dan sentido al esfuerzo: son eso por lo cual vale la pena postergar un gasto hoy para lograr algo más importante mañana. Funcionan como el destino en un GPS: sin ellas, manejás sin rumbo.<\u002Fp>\n  <div class=\"cards c3\">\n    <div class=\"card\"><div class=\"num\">1<\u002Fdiv><h4>Corto plazo<\u002Fh4><p>Hasta 1 año. Auriculares, juntar para una salida, un fondo de emergencia básico. Dan motivación rápida.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">2<\u002Fdiv><h4>Mediano plazo<\u002Fh4><p>De 1 a 5 años. El viaje de egresados, una notebook para la facultad, un curso de programación pago. Requieren más disciplina.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">3<\u002Fdiv><h4>Largo plazo<\u002Fh4><p>Más de 5 años. Un auto, un departamento, independencia financiera. Las más ambiciosas y las que más beneficio traen de planificarse temprano.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"callout\">\n    <span class=\"lbl\">Método SMART<\u002Fspan>\n    <p>Para que una meta funcione de verdad tiene que ser <b>Específica<\u002Fb> (¿qué exactamente?), <b>Medible<\u002Fb> (¿cuánta plata?), <b>Alcanzable<\u002Fb> (¿es realista?), <b>Relevante<\u002Fb> (¿te importa de verdad?) y <b>Temporal<\u002Fb> (¿para cuándo?). No es lo mismo decir \"quiero ahorrar\" que \"quiero juntar $150.000 en 6 meses para una silla gamer ahorrando $25.000 por mes\".<\u002Fp>\n  <\u002Fdiv>\n  <p>Tener metas claras también ayuda a resistir tentaciones. Cuando sabés que cada peso que ahorrás te acerca a algo concreto, es más fácil decir \"hoy no\" a un gasto impulsivo. Las metas financieras son el motor del ahorro y la base de una vida económica con propósito.<\u002Fp>\n<\u002Fsection>\n\n<!-- ===================== BLOQUE 2 ===================== -->\n<div class=\"divider b2\" data-screen-label=\"Bloque 2\">\n  <div class=\"divider-num\">Bloque 2 · Nociones de<\u002Fdiv>\n  <div class=\"divider-title\">Matemática Financiera<\u002Fdiv>\n  <div class=\"divider-sub\">Hasta acá aprendimos a manejar el dinero con criterio. Ahora le sumamos la herramienta matemática para decidir con precisión: ¿cuánto pago de intereses?, ¿cuánto gano en un plazo fijo?, ¿conviene en cuotas o de contado? No hace falta matemática avanzada: fórmulas sencillas, ejemplos concretos y calculadora permitida.<\u002Fdiv>\n  <div class=\"strip\"><span>Valor del dinero<\u002Fspan><span>Interés simple<\u002Fspan><span>Interés compuesto<\u002Fspan><span>Tasas<\u002Fspan><span>Inflación<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<section class=\"tema b2\" data-screen-label=\"B2·T1 Valor del dinero\">\n  <div class=\"kicker\">Bloque 2 · Tema 1<\u002Fdiv>\n  <h2 class=\"tema-title\">El Valor del Dinero en el Tiempo<\u002Fh2>\n  <p class=\"tema-sub\">¿Por qué el dinero de hoy no es igual al de mañana?<\u002Fp>\n  <p>Si te ofrecieran $100.000 hoy o $100.000 dentro de un año, ¿qué elegirías? La respuesta obvia es \"hoy\", pero ¿por qué? Hay tres razones fundamentales que explican este principio central de las finanzas:<\u002Fp>\n  <div class=\"cards c3\">\n    <div class=\"card\"><div class=\"num\">1<\u002Fdiv><h4>La inflación<\u002Fh4><p>Los precios suben con el tiempo. Lo que hoy comprás con $100.000, dentro de un año probablemente cueste más. En Argentina el efecto es muy visible: tu dinero pierde poder adquisitivo si queda quieto.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">2<\u002Fdiv><h4>El costo de oportunidad<\u002Fh4><p>Si tenés el dinero hoy, podés invertirlo o usarlo para generar más (plazo fijo, emprendimiento, comprar para revender). Ese rendimiento potencial se pierde si el dinero llega recién en un año.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">3<\u002Fdiv><h4>El riesgo e incertidumbre<\u002Fh4><p>El futuro es incierto. Un peso prometido para dentro de un año puede no llegar por múltiples razones. Un peso en mano hoy es más seguro que uno prometido para el futuro.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p>Este principio tiene una consecuencia directa: para comparar cantidades de dinero ubicadas en distintos momentos del tiempo, necesitamos una herramienta que las \"traduzca\" al mismo momento. Esa herramienta es el <strong>interés<\u002Fstrong>, que vamos a estudiar en los próximos temas.<\u002Fp>\n  <p><strong>En síntesis:<\u002Fstrong> el dinero tiene un valor temporal. Un peso hoy vale más que un peso mañana. Todo el edificio de la matemática financiera se construye sobre esta idea.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"tema b2\" data-screen-label=\"B2·T2 El interés\">\n  <div class=\"kicker\">Bloque 2 · Tema 2<\u002Fdiv>\n  <h2 class=\"tema-title\">El Interés: Concepto y Variables<\u002Fh2>\n  <p class=\"tema-sub\">Capital, tasa, tiempo y monto<\u002Fp>\n  <p>El interés es el \"precio\" que se paga por usar dinero ajeno (o la ganancia que se obtiene por prestar el propio). Es la compensación por el paso del tiempo y los riesgos involucrados. Sin interés, nadie tendría incentivo para prestar dinero en lugar de usarlo. Para entender cualquier operación financiera, manejamos cuatro variables clave:<\u002Fp>\n  <div class=\"cards c2\">\n    <div class=\"card\"><span class=\"tag\">Capital (C)<\u002Fspan><p>La cantidad de dinero inicial sobre la cual se calculan los intereses. También llamado valor presente o principal. Ej.: depositás $50.000 en un plazo fijo → $50.000 es tu capital.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Tasa de interés (i)<\u002Fspan><p>El porcentaje que se aplica al capital por cada período. Puede ser mensual, anual, diaria, etc. Ej.: una tasa del 5% mensual significa que por cada $100 ganás $5 al mes.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Tiempo (n)<\u002Fspan><p>La cantidad de períodos durante los cuales el capital genera intereses. Días, meses, años… Siempre en la misma unidad que la tasa.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Monto (M)<\u002Fspan><p>El resultado final: el capital original más los intereses generados. M = C + I. Es lo que efectivamente recibís (o debés) al final del período.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"callout\">\n    <span class=\"lbl\">Clave<\u002Fspan>\n    <p>La tasa y el tiempo siempre deben expresarse en la misma unidad temporal. Si la tasa es mensual, el tiempo en meses; si es anual, el tiempo en años. Mezclar unidades es el error más común.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"tema b2\" data-screen-label=\"B2·T3 Interés simple\">\n  <div class=\"kicker\">Bloque 2 · Tema 3<\u002Fdiv>\n  <h2 class=\"tema-title\">Interés Simple<\u002Fh2>\n  <p class=\"tema-sub\">Cálculo, fórmulas y aplicaciones prácticas<\u002Fp>\n  <p>En el régimen de <strong>interés simple<\u002Fstrong>, los intereses se calculan siempre sobre el capital original. No importa cuánto tiempo pase: la base de cálculo nunca cambia. Los intereses que se generan en un período no se suman al capital para el cálculo del siguiente. Las fórmulas fundamentales son:<\u002Fp>\n  <div class=\"formula\">I = C × i × n<\u002Fdiv>\n  <div class=\"formula\">M = C + I = C × (1 + i × n)<\u002Fdiv>\n  <p class=\"fnote\">donde <b>I<\u002Fb> es el interés, <b>C<\u002Fb> el capital, <b>i<\u002Fb> la tasa por período y <b>n<\u002Fb> el número de períodos.<\u002Fp>\n  <div class=\"callout\">\n    <span class=\"lbl\">Ejemplo práctico<\u002Fspan>\n    <p>Prestás $80.000 a un amigo y acordás una tasa de 3% mensual simple durante 4 meses.<br>\n    I = 80.000 × 0,03 × 4 = <b>$9.600<\u002Fb> &nbsp;·&nbsp; M = 80.000 + 9.600 = <b>$89.600<\u002Fb>.<br>\n    El interés mensual es siempre el mismo ($2.400), porque se calcula sobre los $80.000 originales.<\u002Fp>\n  <\u002Fdiv>\n  <p>El interés simple se usa en operaciones de corto plazo: descubiertos bancarios, algunos préstamos entre particulares y ciertas operaciones comerciales. En la práctica, la mayoría de las operaciones modernas usan interés compuesto, pero entender el simple es imprescindible como base.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"tema b2\" data-screen-label=\"B2·T4 Interés compuesto\">\n  <div class=\"kicker\">Bloque 2 · Tema 4<\u002Fdiv>\n  <h2 class=\"tema-title\">Interés Compuesto<\u002Fh2>\n  <p class=\"tema-sub\">Capitalización y el efecto del \"interés sobre interés\"<\u002Fp>\n  <p>El interés compuesto es el mecanismo por el cual los intereses generados en un período se suman al capital y, a partir del período siguiente, también generan intereses. Es el famoso <strong>\"interés sobre interés\"<\u002Fstrong>, la razón por la que se lo suele llamar la fuerza más poderosa del universo. La fórmula del monto es:<\u002Fp>\n  <div class=\"formula\">M = C × (1 + i)<sup>n<\u002Fsup><\u002Fdiv>\n  <p class=\"fnote\">y el interés total generado es I = M − C.<\u002Fp>\n  <p>Tomemos los mismos datos del ejemplo anterior —$80.000 al 3% mensual durante 4 meses—, pero ahora <strong>con capitalización<\u002Fstrong>:<\u002Fp>\n  <table class=\"data\">\n    <thead><tr><th>Mes<\u002Fth><th>Capital inicial<\u002Fth><th>Interés del mes<\u002Fth><th>Capital final<\u002Fth><th>I acum.<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>1<\u002Ftd><td>$80.000<\u002Ftd><td>$2.400<\u002Ftd><td>$82.400<\u002Ftd><td>$2.400<\u002Ftd><\u002Ftr>\n      <tr><td>2<\u002Ftd><td>$82.400<\u002Ftd><td>$2.472<\u002Ftd><td>$84.872<\u002Ftd><td>$4.872<\u002Ftd><\u002Ftr>\n      <tr><td>3<\u002Ftd><td>$84.872<\u002Ftd><td>$2.546<\u002Ftd><td>$87.418<\u002Ftd><td>$7.418<\u002Ftd><\u002Ftr>\n      <tr><td>4<\u002Ftd><td>$87.418<\u002Ftd><td>$2.623<\u002Ftd><td>$90.041<\u002Ftd><td>$10.041<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <p>Con interés simple ganábamos $9.600. Con interés compuesto, $10.041. La diferencia de $441 parece chica en 4 meses, pero a medida que el tiempo crece el efecto se vuelve <strong>exponencial<\u002Fstrong>. En 10 años, la diferencia sería enorme.<\u002Fp>\n  <blockquote class=\"quote\">\"El interés compuesto es la octava maravilla del mundo. Quien lo entiende, lo gana; quien no lo entiende, lo paga.\"<\u002Fblockquote>\n  <p>Este mecanismo trabaja a tu favor cuando ahorrás o invertís, y en tu contra cuando te endeudás. Por eso es tan importante entenderlo bien.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"tema b2\" data-screen-label=\"B2·T5 Comparación\">\n  <div class=\"kicker\">Bloque 2 · Tema 5<\u002Fdiv>\n  <h2 class=\"tema-title\">Comparación entre Regímenes<\u002Fh2>\n  <p class=\"tema-sub\">¿Cuándo conviene cada uno?<\u002Fp>\n  <p>Ahora que conocemos los dos regímenes, veámoslos lado a lado. Movés los controles y observás cómo el interés <strong>simple<\u002Fstrong> crece de forma lineal (en línea recta) mientras que el <strong>compuesto<\u002Fstrong> crece de forma exponencial (cada vez más rápido). A mayor plazo, mayor es la diferencia entre ambos.<\u002Fp>\n\n  <div class=\"widget b2\">\n    <div class=\"widget-head\"><span class=\"widget-tag\">Probalo<\u002Fspan><h4>Simulador: Interés Simple vs. Compuesto<\u002Fh4><\u002Fdiv>\n    <p class=\"widget-note screen-only\">Ajustá capital, tasa y plazo. El gráfico muestra el interés acumulado mes a mes en cada régimen.<\u002Fp>\n    <div class=\"controls\">\n      <div class=\"slider-row\"><label>Capital <b>{{ capTxt }}<\u002Fb><\u002Flabel><input type=\"range\" min=\"10000\" max=\"500000\" step=\"10000\" value=\"{{ cap }}\" oninput=\"{{ onCap }}\"><\u002Fdiv>\n      <div class=\"slider-row\"><label>Tasa mensual <b>{{ tasaTxt }}<\u002Fb><\u002Flabel><input type=\"range\" min=\"1\" max=\"15\" step=\"0.5\" value=\"{{ tasa }}\" oninput=\"{{ onTasa }}\"><\u002Fdiv>\n      <div class=\"slider-row\" style=\"grid-column:1 / -1\"><label>Plazo <b>{{ mesesTxt }}<\u002Fb><\u002Flabel><input type=\"range\" min=\"1\" max=\"24\" step=\"1\" value=\"{{ meses }}\" oninput=\"{{ onMeses }}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"chart\">\n      <div class=\"chart-bars\">\n        <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"12\">\n          <div class=\"bar-group\" title=\"Mes {{ b.mes }} — Simple {{ b.sTxt }} · Compuesto {{ b.cTxt }}\">\n            <div class=\"bar s\" style=\"height:{{ b.sh }}px\"><\u002Fdiv>\n            <div class=\"bar c\" style=\"height:{{ b.ch }}px\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"chart-axis\">\n        <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"12\"><span>{{ b.mes }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"legend\"><span><i style=\"background:var(--c2soft)\"><\u002Fi>Interés simple<\u002Fspan><span><i style=\"background:var(--c2)\"><\u002Fi>Interés compuesto<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"results\">\n      <div class=\"result\"><div class=\"rl\">Interés simple<\u002Fdiv><div class=\"rv\">{{ simpleITxt }}<\u002Fdiv><\u002Fdiv>\n      <div class=\"result\"><div class=\"rl\">Interés compuesto<\u002Fdiv><div class=\"rv\">{{ compITxt }}<\u002Fdiv><\u002Fdiv>\n      <div class=\"result hi\"><div class=\"rl\">Diferencia a favor<\u002Fdiv><div class=\"rv\">{{ diffTxt }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cards c2\">\n    <div class=\"card\"><span class=\"tag\">¿Cuándo conviene el simple?<\u002Fspan><p>Si sos deudor: el interés simple genera menos intereses, así que tu deuda crece más lento. En la práctica rara vez te lo ofrecen, pero es lo que buscás como tomador de crédito.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">¿Cuándo conviene el compuesto?<\u002Fspan><p>Si sos inversor o ahorrista: tus intereses generan más intereses y tu dinero crece más rápido. Cuanto antes empieces, más aprovechás el efecto exponencial.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"callout\">\n    <span class=\"lbl\">Conclusión práctica<\u002Fspan>\n    <p>Como ahorristas, queremos interés compuesto a nuestro favor. Como deudores, queremos tasas lo más bajas posible y plazos cortos, porque el compuesto trabaja en nuestra contra.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"tema b2\" data-screen-label=\"B2·T6 Tasas\">\n  <div class=\"kicker\">Bloque 2 · Tema 6<\u002Fdiv>\n  <h2 class=\"tema-title\">Tasas de Interés en la Vida Cotidiana<\u002Fh2>\n  <p class=\"tema-sub\">TNA, TEA, tasas reales y nominales<\u002Fp>\n  <p>Cuando ves una publicidad de un banco que dice \"TNA 75%\" o la cuota de la tarjeta dice \"TEA 120%\", ¿sabés qué significan esos números? Las tasas tienen distintas formas de expresarse, y entenderlas es fundamental para no llevarse sorpresas.<\u002Fp>\n  <div class=\"cards c3\">\n    <div class=\"card\"><div class=\"num\">1<\u002Fdiv><h4>TNA<\u002Fh4><p>Tasa Nominal Anual. Es la que te \"dicen\" o publicitan. Es proporcional, no contempla capitalización. Sirve para calcular la tasa del período.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">2<\u002Fdiv><h4>Tasa del período<\u002Fh4><p>Se obtiene dividiendo la TNA por la cantidad de períodos al año. Ej.: TNA 72% ÷ 12 meses = 6% mensual.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"num\">3<\u002Fdiv><h4>TEA<\u002Fh4><p>Tasa Efectiva Anual. Es lo que realmente ganás o pagás en un año, incluyendo la capitalización. Siempre es mayor que la TNA.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p>La relación entre TNA y TEA es:<\u002Fp>\n  <div class=\"formula\">TEA = (1 + <span class=\"frac\"><span class=\"num\">TNA<\u002Fspan><span class=\"den\">m<\u002Fspan><\u002Fspan>)<sup>m<\u002Fsup> − 1<\u002Fdiv>\n  <p class=\"fnote\">donde <b>m<\u002Fb> es la cantidad de capitalizaciones al año (12 si es mensual, 365 si es diaria, etc.).<\u002Fp>\n  <div class=\"cards c2\">\n    <div class=\"card\"><span class=\"tag\">Tasa nominal<\u002Fspan><p>La tasa \"de referencia\", sin considerar la capitalización. Útil para comparar rápido, pero no refleja el costo o rendimiento real de la operación.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Tasa real<\u002Fspan><p>La que resulta de descontar la inflación. Si un plazo fijo rinde 7% mensual pero la inflación es 8%, tu tasa real es negativa: perdés poder de compra, aunque nominalmente \"ganaste\".<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p>En Argentina, la diferencia entre tasa nominal y real es crucial. Siempre preguntáte: <strong>¿estoy ganando más que la inflación, o solo parece que gano?<\u002Fstrong><\u002Fp>\n<\u002Fsection>\n\n<section class=\"tema b2\" data-screen-label=\"B2·T7 Aplicaciones\">\n  <div class=\"kicker\">Bloque 2 · Tema 7<\u002Fdiv>\n  <h2 class=\"tema-title\">Aplicaciones Financieras Actuales<\u002Fh2>\n  <p class=\"tema-sub\">Plazos fijos, préstamos y tarjetas de crédito<\u002Fp>\n  <p>Toda la teoría que vimos cobra sentido real cuando la aplicamos a las operaciones con las que convivimos todos los días. Veamos las tres más comunes:<\u002Fp>\n  <div class=\"cards c3\">\n    <div class=\"card\"><span class=\"tag\">Plazo Fijo<\u002Fspan><p>Depositás dinero por un período mínimo (en general 30 días) y al final recibís el capital más los intereses. Usa interés compuesto si renovás. Hay tradicionales y UVA (ajustados por inflación).<br><br><b>Ventaja:<\u002Fb> seguro y simple.<br><b>Riesgo:<\u002Fb> si la inflación supera la tasa, perdés poder de compra.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Préstamos personales<\u002Fspan><p>El banco te presta dinero y devolvés en cuotas que incluyen capital + intereses. Suelen usar sistema francés (cuotas iguales, más intereses al inicio). El CFT es el dato más importante.<br><br><b>Ventaja:<\u002Fb> accedés a dinero que no tenés.<br><b>Riesgo:<\u002Fb> comprometés ingresos futuros.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Tarjetas de crédito<\u002Fspan><p>Comprás hoy y pagás después. Si pagás el total antes del vencimiento, no hay interés. Si pagás el mínimo, el resto genera intereses compuestos altísimos (TEA frecuentemente &gt; 200%).<br><br><b>Ventaja:<\u002Fb> flexibilidad y financiación sin interés (1 pago).<br><b>Riesgo:<\u002Fb> espiral de deuda si solo pagás el mínimo.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"callout\">\n    <span class=\"lbl\">Dato clave<\u002Fspan>\n    <p>Antes de contratar cualquier producto financiero, pedí siempre el <b>CFT (Costo Financiero Total)<\u002Fb>. Es el único número que refleja el costo real de la operación, incluyendo intereses, comisiones, seguros e impuestos.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"tema b2\" data-screen-label=\"B2·T8 Inflación\">\n  <div class=\"kicker\">Bloque 2 · Tema 8<\u002Fdiv>\n  <h2 class=\"tema-title\">La Inflación y el Interés<\u002Fh2>\n  <p class=\"tema-sub\">Tasa real vs. tasa nominal en contexto argentino<\u002Fp>\n  <p>Ningún análisis financiero en Argentina está completo sin hablar de inflación. La <strong>inflación<\u002Fstrong> es el aumento sostenido y generalizado de los precios en una economía. Cuando es alta, el dinero pierde poder de compra rápidamente, y eso afecta directamente a todo lo que venimos estudiando: ahorro, inversión y deuda. La relación entre tasa nominal e inflación se expresa con la ecuación de Fisher:<\u002Fp>\n  <div class=\"formula\">1 + i<sub>real<\u002Fsub> = <span class=\"frac\"><span class=\"num\">1 + i<sub>nominal<\u002Fsub><\u002Fspan><span class=\"den\">1 + π<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <p class=\"fnote\">donde π es la tasa de inflación del período. En forma simplificada: i<sub>real<\u002Fsub> ≈ i<sub>nominal<\u002Fsub> − π.<\u002Fp>\n\n  <div class=\"widget b2\">\n    <div class=\"widget-head\"><span class=\"widget-tag\">Probalo<\u002Fspan><h4>Calculadora de Tasa Real<\u002Fh4><\u002Fdiv>\n    <p class=\"widget-note screen-only\">Compará el rendimiento nominal de un plazo fijo contra la inflación del mismo período.<\u002Fp>\n    <div class=\"controls\">\n      <div class=\"slider-row\"><label>Rendimiento nominal mensual <b>{{ nominalTxt }}<\u002Fb><\u002Flabel><input type=\"range\" min=\"0\" max=\"20\" step=\"0.5\" value=\"{{ nominal }}\" oninput=\"{{ onNominal }}\"><\u002Fdiv>\n      <div class=\"slider-row\"><label>Inflación mensual <b>{{ inflacionTxt }}<\u002Fb><\u002Flabel><input type=\"range\" min=\"0\" max=\"20\" step=\"0.5\" value=\"{{ inflacion }}\" oninput=\"{{ onInflacion }}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tr-out {{ trClass }}\">\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);font-weight:600\">Tasa real aproximada<\u002Fdiv>\n      <div class=\"tr-big\">{{ realTxt }}<\u002Fdiv>\n      <p class=\"tr-msg\">{{ trMsg }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"cards c2\">\n    <div class=\"card\"><span class=\"tag\">Tasa real positiva ✅<\u002Fspan><p>Si un plazo fijo rinde 8% mensual y la inflación es 5%, tu tasa real es aproximadamente +3%. Estás ganando poder de compra.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><span class=\"tag\">Tasa real negativa ❌<\u002Fspan><p>Si el plazo fijo rinde 6% mensual pero la inflación es 10%, tu tasa real es −4%. Perdés plata aunque el banco te pague intereses.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p>En Argentina, durante muchos períodos recientes la tasa real fue negativa: quienes tenían plata en el banco o en pesos perdían valor constantemente. Esto explica por qué muchos buscan refugio en el dólar, en inversiones indexadas (UVA, CER) o en activos reales. La inflación también afecta a los deudores: si tomaste un préstamo a tasa fija y la inflación sube mucho, en términos reales tu deuda se \"licúa\" (vale menos). Por eso, en contextos inflacionarios, los bancos suelen cobrar tasas muy altas o ajustables.<\u002Fp>\n  <div class=\"callout\">\n    <span class=\"lbl\">Consejo final<\u002Fspan>\n    <p>Cada vez que evalúes una inversión o una deuda, no mires solo la tasa nominal. Siempre calculá la tasa real descontando la inflación. Es la única forma de saber si realmente estás ganando o perdiendo.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== CIERRE ===================== -->\n<section class=\"tema\" data-screen-label=\"Resumen visual\">\n  <p class=\"kicker\" style=\"color:var(--muted)\">Síntesis<\u002Fp>\n  <h2 class=\"tema-title\">Resumen Visual: Todo lo Aprendido<\u002Fh2>\n  <p class=\"tema-sub\" style=\"color:var(--muted)\">Cómo se conectan los conceptos de toda la unidad<\u002Fp>\n  <p>Llegamos al final del recorrido. Cada uno de estos temas no es un compartimiento estanco: están interconectados. El presupuesto necesita que entiendas ingresos y gastos. El ahorro cobra sentido cuando tenés metas. Las metas se potencian con el interés compuesto. Y todo se ve afectado por la inflación.<\u002Fp>\n  <div class=\"flow\">\n    <span class=\"chip g\">Ingresos y gastos<\u002Fspan><span class=\"arr\">→<\u002Fspan>\n    <span class=\"chip g\">Presupuesto<\u002Fspan><span class=\"arr\">→<\u002Fspan>\n    <span class=\"chip g\">Ahorro<\u002Fspan><span class=\"arr\">→<\u002Fspan>\n    <span class=\"chip g\">Metas<\u002Fspan><span class=\"arr\">→<\u002Fspan>\n    <span class=\"chip b\">Interés compuesto<\u002Fspan><span class=\"arr\">→<\u002Fspan>\n    <span class=\"chip b\">Tasa real<\u002Fspan><span class=\"arr\">↺<\u002Fspan>\n    <span class=\"chip b\">Inflación<\u002Fspan>\n  <\u002Fdiv>\n  <p>Dominar estos conceptos es tener las herramientas para tomar decisiones financieras inteligentes durante toda tu vida.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"tema\" data-screen-label=\"Cierre\">\n  <div class=\"divider b2\" style=\"break-before:auto\">\n    <div class=\"divider-num\">Cierre y reflexión final<\u002Fdiv>\n    <div class=\"divider-title\">Tu futuro financiero empieza hoy<\u002Fdiv>\n    <div class=\"divider-sub\">Terminamos la Unidad 2, pero en realidad esto es un punto de partida. Todo lo que aprendieron —desde armar un presupuesto hasta calcular una tasa real— son herramientas que van a usar el resto de sus vidas, mucho más allá de la escuela.<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin-top:22px\">Como técnicos en informática tienen una ventaja enorme: saben usar planillas de cálculo, pueden programar simuladores y entienden la lógica matemática. Usen esas habilidades para tomar el control de sus finanzas. Armen una planilla de presupuesto, simulen plazos fijos, calculen el costo real de una cuota con tarjeta. La tecnología que dominan es la mejor aliada de las finanzas personales.<\u002Fp>\n  <div class=\"cards c4\">\n    <div class=\"card b1\"><h4>🧠 Aprendé<\u002Fh4><p>Nunca dejes de informarte sobre economía y finanzas. El mundo cambia rápido y las reglas del juego también.<\u002Fp><\u002Fdiv>\n    <div class=\"card b1\"><h4>📋 Planificá<\u002Fh4><p>Armá tu presupuesto, fijá metas claras y revisá tus números cada mes. La planificación es poder.<\u002Fp><\u002Fdiv>\n    <div class=\"card b1\"><h4>💪 Actuá<\u002Fh4><p>El mejor plan no sirve si no se ejecuta. Empezá hoy, con lo que tengas, por más chico que sea.<\u002Fp><\u002Fdiv>\n    <div class=\"card b1\"><h4>🔄 Ajustá<\u002Fh4><p>Las circunstancias cambian. Tu plan financiero debe ser flexible y adaptarse a la realidad.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <blockquote class=\"quote b2\">\"La educación financiera no te garantiza ser rico, pero sí te garantiza no tomar decisiones pobres.\"<\u002Fblockquote>\n  <div class=\"signoff\">\n    <b>Profesora Verónica Vila Bordó<\u002Fb>\n    <div class=\"role\">EETP N°602 \"Gral. José de San Martín\" · 6.º \"A\" — Técnicos en Informática<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Ftd><\u002Ftr><\u002Ftbody>\n<tfoot><tr><td class=\"ftr-space\"><\u002Ftd><\u002Ftr><\u002Ftfoot>\n<\u002Ftable>\n<\u002Fmain>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;880px&quot;,&quot;height&quot;:&quot;1100px&quot;},&quot;ingresoInicial&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200000,&quot;min&quot;:50000,&quot;max&quot;:800000,&quot;step&quot;:10000,&quot;tsType&quot;:&quot;number&quot;},&quot;capitalInicial&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:80000,&quot;min&quot;:10000,&quot;max&quot;:500000,&quot;step&quot;:10000,&quot;tsType&quot;:&quot;number&quot;},&quot;tasaInicial&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:15,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      ingreso: (props && props.ingresoInicial) || 200000,\n      cap: (props && props.capitalInicial) || 80000,\n      tasa: (props && props.tasaInicial) || 3,\n      meses: 12,\n      nominal: 6,\n      inflacion: 8,\n    };\n  }\n  f(n) { return '$' + Math.round(n).toLocaleString('es-AR'); }\n  renderVals() {\n    const s = this.state, f = (n) => this.f(n);\n\n    // 50/30/20\n    const nec = s.ingreso * 0.5, des = s.ingreso * 0.3, aho = s.ingreso * 0.2;\n\n    // simulador simple vs compuesto\n    const i = s.tasa / 100, n = s.meses;\n    const simpleI = s.cap * i * n;\n    const compM = s.cap * Math.pow(1 + i, n);\n    const compI = compM - s.cap;\n    const diff = compI - simpleI;\n    const maxV = Math.max(s.cap * Math.pow(1 + i, n) - s.cap, 1);\n    const H = 168;\n    const bars = [];\n    for (let m = 1; m <= n; m++) {\n      const sV = s.cap * i * m;\n      const cV = s.cap * Math.pow(1 + i, m) - s.cap;\n      bars.push({\n        mes: String(m),\n        sh: Math.max(2, Math.round(sV / maxV * H)),\n        ch: Math.max(2, Math.round(cV / maxV * H)),\n        sTxt: f(sV),\n        cTxt: f(cV),\n      });\n    }\n\n    // tasa real\n    const real = ((1 + s.nominal / 100) / (1 + s.inflacion / 100) - 1) * 100;\n    const trPos = real >= 0;\n\n    return {\n      // 50/30/20\n      ingreso: f(s.ingreso), ingresoVal: s.ingreso,\n      onIngreso: (e) => this.setState({ ingreso: +e.target.value }),\n      nec: f(nec), des: f(des), aho: f(aho),\n      // simulador\n      cap: s.cap, capTxt: f(s.cap), onCap: (e) => this.setState({ cap: +e.target.value }),\n      tasa: s.tasa, tasaTxt: s.tasa + '%', onTasa: (e) => this.setState({ tasa: +e.target.value }),\n      meses: s.meses, mesesTxt: s.meses + (s.meses === 1 ? ' mes' : ' meses'),\n      onMeses: (e) => this.setState({ meses: +e.target.value }),\n      simpleITxt: f(simpleI), compITxt: f(compI), diffTxt: f(diff),\n      bars,\n      // tasa real\n      nominal: s.nominal, nominalTxt: s.nominal + '%', onNominal: (e) => this.setState({ nominal: +e.target.value }),\n      inflacion: s.inflacion, inflacionTxt: s.inflacion + '%', onInflacion: (e) => this.setState({ inflacion: +e.target.value }),\n      realTxt: (real >= 0 ? '+' : '') + real.toFixed(1) + '%',\n      trClass: trPos ? 'pos' : 'neg',\n      trMsg: trPos\n        ? 'Ganás poder de compra: tu dinero crece más rápido que los precios.'\n        : 'Perdés poder de compra: aunque el banco te pague intereses, la inflación te gana.',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
